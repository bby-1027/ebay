<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>商品审核工作台</title>
<style>
:root{font-family:Inter,"Microsoft YaHei",system-ui,sans-serif;color:#23332f;background:#f5f7f6;font-size:14px;--green:#216b52;--line:#e2e8e4;--muted:#748079;--bg:#f9fbf9;}
*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:8px;padding:10px 15px;background:white;color:inherit;transition:all .2s}button:hover{background:#f1f6f3}button:disabled{cursor:not-allowed;opacity:.5}.primary{background:var(--green);border-color:var(--green);color:white}.primary:hover{background:#17583f}.danger{color:#a53d38;border-color:#fceceb}.danger:hover{background:#fceceb}.linkbtn{border:0;background:transparent;color:var(--green);padding:0;font-size:13px}.linkbtn:hover{text-decoration:underline;background:transparent}
header{height:82px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(24px,calc((100vw - 1260px)/2))}
.brand{display:flex;align-items:center;gap:12px}.logo{background:var(--green);color:white;border-radius:10px;padding:10px;font-weight:800;font-size:18px}h1{font-size:19px;margin:0 0 4px}h2{font-size:20px;margin:0 0 12px}
main{max-width:1260px;padding:30px 24px 64px;margin:auto}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.card{background:white;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:20px}
.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;text-align:left;white-space:normal}th{background:#f7f9f7;color:#75817b;font-weight:500;font-size:12px}th,td{padding:14px 16px;border-bottom:1px solid #edf0ed;vertical-align:middle}td{font-size:13px}
.title-col{max-width:320px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-overflow:ellipsis}
.badge{display:inline-block;white-space:nowrap;padding:3px 8px;border-radius:4px;font-size:12px;border:1px solid transparent}
.b-pass{background:#e7f4ec;color:#28714a;border-color:#c3e6d3}.b-warn{background:#fff3dd;color:#966314;border-color:#f2d8a6}.b-err{background:#fceceb;color:#a34f48;border-color:#f2cac7}.b-run{background:#e9f0fb;color:#4265a0;border-color:#c3d4f2}.b-gray{background:#f0f2f0;color:#748079;border-color:#e2e5e2}
.toolbar{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#f9fbf9;border-bottom:1px solid var(--line);flex-wrap:wrap;gap:10px}
.batch-bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.search-input{width:220px;padding:8px 12px;border:1px solid var(--line);border-radius:6px}
dialog{border:1px solid var(--line);border-radius:14px;padding:0;max-width:calc(100vw - 28px);max-height:90vh;box-shadow:0 20px 80px #193d2526;width:1000px;margin:auto}
dialog::backdrop{background:#1c332c66}.dialoghead{padding:16px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:white;z-index:2}.dialoghead h3{font-size:17px;margin:0}.close{border:0;padding:4px 9px;font-size:22px}
.dialogbody{padding:24px}.dialogfoot{display:flex;justify-content:flex-end;gap:10px;padding:16px 24px;border-top:1px solid var(--line);background:#fafbf9;position:sticky;bottom:0}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.field{margin-bottom:16px}.field .label{color:var(--muted);font-size:12px;margin-bottom:6px}.text{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6;font-size:13px;max-height:300px;overflow-y:auto;background:#f7f9f6;padding:10px;border-radius:6px;border:1px solid #eef1ee}
.section-box{border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:20px;background:white}.section-box h4{margin:0 0 12px;font-size:14px;color:#334239;border-left:3px solid var(--green);padding-left:8px}
.form-group label{display:block;margin-bottom:6px;font-size:13px;font-weight:500}.form-group textarea,.form-group select,.form-group input[type=text]{width:100%;border:1px solid var(--line);border-radius:6px;padding:10px;margin-bottom:12px;resize:vertical}
.hidden{display:none!important}
#toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);padding:12px 20px;background:#243b30;color:white;border-radius:6px;z-index:100;display:none;box-shadow:0 5px 20px rgba(0,0,0,0.2)}
</style>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" defer></script>
</head>
<body>
<header>
  <div class="brand"><div class="logo">✓</div><div><h1>商品审核工作台</h1><small>批次管理 · 风险审核 · 导出</small></div></div>
  <div>
    <button id="btnSettings">设置</button>
  </div>
</header>
<main>
  <div id="homeView">
    <div class="actions" style="justify-content:space-between;margin-bottom:20px">
      <h2>批次列表</h2>
      <button id="importBtn" class="primary">＋ 导入新批次</button>
    </div>
    <div class="card">
      <div class="tablewrap">
        <table>
          <thead><tr><th>批次名称 / 导入时间</th><th>商品数量</th><th>当前进度</th><th>统计</th><th>操作</th></tr></thead>
          <tbody id="batchRows"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="itemsView" class="hidden">
    <div class="actions" style="margin-bottom:20px">
      <button id="backHomeBtn">← 返回批次列表</button>
      <h2 id="currentBatchName" style="margin:0"></h2>
    </div>
    <div class="card">
      <div class="toolbar">
        <div class="batch-bar">
          <button id="btnBatchRetry" class="primary">重试失败项</button>
          <button id="exportBatchBtn" class="primary">导出通过商品</button>
        </div>
        <div style="display:flex;gap:10px">
          <input type="text" id="searchInput" class="search-input" placeholder="搜索 SKU 或标题">
          <select id="filterStatus" class="search-input" style="width:130px">
            <option value="all">全部状态</option>
            <option value="review_verify">待核验</option>
            <option value="review_passed">已通过</option>
          </select>
        </div>
      </div>
      <div class="tablewrap">
        <table>
          <thead>
            <tr>
              <th>SKU</th><th>商品标题</th><th>Amazon链接</th><th>采集状态</th><th>审核状态</th><th>文案状态</th><th>原因 / 待办</th><th>操作</th>
            </tr>
          </thead>
          <tbody id="itemRows"></tbody>
        </table>
      </div>
    </div>
  </div>
</main>

<dialog id="importDialog">
  <div class="dialoghead"><h3>导入新批次</h3><button class="close" data-close>×</button></div>
  <div class="dialogbody">
    <div style="margin-bottom:15px">
      <label>批次名称（可选）</label>
      <input type="text" id="inputBatchName" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:6px" placeholder="不填则自动按日期生成">
    </div>
    <div style="margin-bottom:10px;font-weight:500">SKU 列表</div>
    <textarea id="skuInput" style="width:100%;height:150px;border:1px solid var(--line);border-radius:6px;padding:10px;font-family:monospace;margin-bottom:15px" placeholder="每行一个亚马逊 ASIN..."></textarea>
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:15px">
      <span style="color:var(--muted)">或</span>
      <input type="file" id="goodsFile" accept=".xlsx,.xls,.csv" style="font-size:13px">
    </div>
    <div id="importSummary" style="background:#f0f4f1;padding:10px;border-radius:6px;font-size:13px;margin-bottom:15px">待导入数量：0 个</div>
    <div id="importError" style="color:#a53d38;font-size:13px;margin-top:10px"></div>
  </div>
  <div class="dialogfoot"><button data-close>取消</button><button id="btnConfirmImport" class="primary">确认并开始</button></div>
</dialog>

<dialog id="detailDialog">
  <div class="dialoghead">
    <div><h3 id="dtTitle" style="margin-bottom:4px">商品详情</h3><span id="dtStatus" class="badge b-gray"></span></div>
    <button class="close" data-close>×</button>
  </div>
  <div id="dtBody" class="dialogbody"></div>
  <div class="dialogfoot" id="dtFooter"></div>
</dialog>

<dialog id="settingsDialog" style="width:400px">
  <div class="dialoghead"><h3>设置</h3><button class="close" data-close>×</button></div>
  <div class="dialogbody">
    <div class="section-box">
      <h4>导出字段设置</h4>
      <p class="muted" style="font-size:12px;margin-bottom:12px">此设置仅保存在本浏览器。</p>
      <label style="display:block;margin-bottom:8px"><input type="checkbox" checked disabled> SKU（必选）</label>
      <label style="display:block;margin-bottom:8px"><input type="checkbox" id="expLink" checked> 亚马逊链接</label>
      <label style="display:block;margin-bottom:8px"><input type="checkbox" id="expTitle" checked> 清理后的标题</label>
      <label style="display:block;margin-bottom:8px"><input type="checkbox" id="expBullets" checked> 清理后的五点描述</label>
      <label style="display:block;margin-bottom:8px"><input type="checkbox" id="expDesc" checked> 清理后的长描述</label>
    </div>
  </div>
  <div class="dialogfoot"><button class="primary" data-close>保存</button></div>
</dialog>

<div id="toast"></div>

<script>
'use strict';
const WORKER_URL = 'https://scraper-proxy.1172743763.workers.dev';
const TOKEN = 'ebay1031'; 

let app = {
  serverVersion: 0, batches: [], currentBatchId: null, view: 'home',
  searchQuery: '', filterStatus: 'all', detailItemId: null, isLoopRunning: false
};
let exportPrefs = { link: true, title: true, bullets: true, desc: true };

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function asin(v) { const s = String(v).trim().toUpperCase(); return /^[A-Z0-9]{10}$/.test(s) ? s : null; }
function toast(msg) {
  const el = $('toast'); el.textContent = msg; el.style.display = 'block';
  clearTimeout(el.timer); el.timer = setTimeout(() => el.style.display = 'none', 4000);
}

async function fetchWithTimeout(resource, options = {}) {
  const { timeout = 15000 } = options;
  const controller = new AbortController();
  const id = setTimeout(() => controller.abort(), timeout);
  const response = await fetch(resource, { ...options, signal: controller.signal });
  clearTimeout(id);
  return response;
}

function normalizeCollectedData(raw) {
  const target = raw.data || raw.product || raw.item || raw;
  let descValue = target.description || target['长描述'] || target['商品描述'] || target['描述'] || '';
  return {
    title: target.title || target['商品标题'] || target['标题'] || '',
    brand: target.brand || target['品牌'] || '',
    bullets: target.bullets || target['五点描述'] || target['卖点'] || target.bullet_points || target['五点'] || '',
    description: descValue,
    images: target.images || target['商品图片'] || target.imageurls || '',
    _raw: raw
  };
}

// 【关键修复】：拉取数据不再带有强制阻断逻辑，纯粹拉取
async function fetchData(silent = false) {
  try {
    const res = await fetchWithTimeout(`${WORKER_URL}/api/data`, { headers: { 'X-Workbench-Token': TOKEN } });
    if (!res.ok) throw new Error('获取数据失败: ' + res.status);
    const data = await res.json();
    app.serverVersion = data.version || 0;
    app.batches = data.batches || [];
    render();
  } catch (e) { if(!silent) toast(e.message); }
}

async function saveData() {
  try {
    const payload = { version: app.serverVersion, batches: app.batches };
    const res = await fetchWithTimeout(`${WORKER_URL}/api/data`, {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Workbench-Token': TOKEN },
      body: JSON.stringify(payload)
    });
    if (res.status === 409) { await fetchData(true); return false; }
    if (!res.ok) throw new Error('保存失败: ' + res.status);
    const result = await res.json();
    app.serverVersion = result.version;
    return true;
  } catch (e) { toast(e.message); return false; }
}

async function init() {
  const prefsStr = localStorage.getItem('ebay_export_prefs');
  if (prefsStr) { try { exportPrefs = JSON.parse(prefsStr); } catch (e) {} }
  $('expLink').checked = exportPrefs.link;
  $('expTitle').checked = exportPrefs.title;
  $('expBullets').checked = exportPrefs.bullets;
  $('expDesc').checked = exportPrefs.desc;
  
  await fetchData();
  
  // 【只在这里执行一次拦截】：页面加载时，如果发现有 running 状态的批次，强制转为 paused
  let changed = false;
  app.batches.forEach(b => {
    if (b.runStatus === 'running') {
      b.runStatus = 'paused';
      b.items.forEach(i => {
        if (i.collectStatus === 'collecting') { i.collectStatus = 'pending'; i.reason = '已暂停'; }
        if (i.reviewStatus === 'auditing') { i.reviewStatus = 'pending'; i.reason = '已暂停'; }
      });
      changed = true;
    }
  });
  if (changed) {
    await saveData();
    render();
    toast('已自动拦截上次未完成的运行任务，请确认后手动点击继续。');
  }
}

// ================= 渲染 =================

function renderHome() {
  $('homeView').classList.remove('hidden');
  $('itemsView').classList.add('hidden');
  const sorted = [...app.batches].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
  
  $('batchRows').innerHTML = sorted.map(b => {
    const total = b.items.length;
    let cDone = 0, rDone = 0, rVerify = 0, cpDone = 0, cErr = 0;
    
    b.items.forEach(i => {
      if (i.collectStatus === 'collected') cDone++;
      if (i.collectStatus === 'error') cErr++;
      if (i.reviewStatus === 'passed') rDone++;
      if (i.reviewStatus === 'verify') rVerify++;
      if (i.reviewStatus === 'passed' && i.copyStatus === 'completed') cpDone++;
    });

    let bStatus = '未开始'; let bCls = 'b-gray';
    let btnAction = `<button class="primary" onclick="startBatch('${b.id}')">一键开始</button>`;
    
    if (b.runStatus === 'running') {
      bStatus = '运行中'; bCls = 'b-run';
      btnAction = `<button class="danger" onclick="pauseBatch('${b.id}')">暂停</button>`;
    } else if (b.runStatus === 'paused') {
      bStatus = '已暂停'; bCls = 'b-warn';
      btnAction = `<button class="primary" onclick="resumeBatch('${b.id}')">继续</button>`;
    } else if (total > 0 && cDone === total && rDone + rVerify === total && (cpDone === rDone || rDone === 0)) {
      bStatus = '已完成'; bCls = 'b-pass';
      btnAction = `<span class="muted">-</span>`;
    }

    return `<tr>
      <td><strong>${esc(b.name)}</strong><br><small style="color:var(--muted)">${new Date(b.createdAt).toLocaleString()}</small></td>
      <td>${total}</td>
      <td><span class="badge ${bCls}">${bStatus}</span><br><small>采集 ${cDone}/${total} | 审核 ${rDone+rVerify}/${total} | 文案 ${cpDone}</small></td>
      <td>通过: ${rDone} | 核验: ${rVerify} | 失败: ${cErr} | 可导出: ${cpDone}</td>
      <td>
        ${btnAction}
        <span style="color:var(--line);margin:0 6px">|</span>
        <button class="linkbtn" onclick="enterBatch('${b.id}')">明细</button>
      </td>
    </tr>`;
  }).join('');
}

function renderItems() {
  const batch = app.batches.find(b => b.id === app.currentBatchId);
  if (!batch) return goHome();
  $('homeView').classList.add('hidden');
  $('itemsView').classList.remove('hidden');
  $('currentBatchName').textContent = batch.name;

  const filtered = batch.items.filter(i => {
    const fTitle = (i.collected?.title || i.source?.title || '').toLowerCase();
    const matchSearch = !app.searchQuery || i.asin.includes(app.searchQuery.toUpperCase()) || fTitle.includes(app.searchQuery.toLowerCase());
    let matchStatus = true;
    if (app.filterStatus === 'review_verify') matchStatus = i.reviewStatus === 'verify';
    else if (app.filterStatus === 'review_passed') matchStatus = i.reviewStatus === 'passed';
    return matchSearch && matchStatus;
  });

  $('itemRows').innerHTML = filtered.map(i => {
    const title = i.collected?.title || i.source?.title || '尚未采集标题';
    const link = `https://www.amazon.com/dp/${i.asin}`;
    
    let cTag = `<span class="badge b-gray">待采集</span>`;
    if (i.collectStatus === 'collecting') cTag = `<span class="badge b-run">采集中</span>`;
    if (i.collectStatus === 'collected') cTag = `<span class="badge b-pass">已采集</span>`;
    if (i.collectStatus === 'error') cTag = `<span class="badge b-err">失败</span>`;

    let rTag = `<span class="badge b-gray">待审核</span>`;
    if (i.reviewStatus === 'auditing') rTag = `<span class="badge b-run">审核中</span>`;
    if (i.reviewStatus === 'skipped') rTag = `<span class="badge b-gray">资料筛除</span>`;
    if (i.reviewStatus === 'verify') rTag = `<span class="badge b-warn">待核验</span>`;
    if (i.reviewStatus === 'passed') rTag = `<span class="badge b-pass">已通过</span>`;
    if (i.reviewStatus === 'excluded') rTag = `<span class="badge b-err" style="background:#f0f2f0">已排除</span>`;
    if (i.reviewStatus === 'error') rTag = `<span class="badge b-err">失败</span>`;

    let cpTag = `<span class="badge b-gray">-</span>`;
    if (i.reviewStatus === 'passed') {
       if (i.copyStatus === 'pending') cpTag = `<span class="badge b-warn">待确认</span>`;
       if (i.copyStatus === 'completed') cpTag = `<span class="badge b-pass">已确认</span>`;
    }

    return `<tr>
      <td style="font-family:monospace">${i.asin}</td>
      <td><div class="title-col" title="${esc(title)}">${esc(title)}</div></td>
      <td><a href="${link}" target="_blank" rel="noopener noreferrer">查看 ↗</a></td>
      <td>${cTag}</td>
      <td>${rTag}</td>
      <td>${cpTag}</td>
      <td style="color:var(--muted);font-size:12px;max-width:200px">${esc(i.reason || '-')}</td>
      <td><button class="linkbtn" onclick="openDetail('${i.itemId}')">查看</button></td>
    </tr>`;
  }).join('');
}

function render() { if (app.view === 'home') renderHome(); else renderItems(); }
function enterBatch(id) { app.currentBatchId = id; app.view = 'items'; app.searchQuery = ''; app.filterStatus = 'all'; $('searchInput').value = ''; $('filterStatus').value = 'all'; render(); }
function goHome() { app.view = 'home'; app.currentBatchId = null; render(); }
window.enterBatch = enterBatch; window.openDetail = openDetail;

// ================= 核心调度引擎 =================
async function startBatch(id) {
  const b = app.batches.find(x => x.id === id);
  if (!b || b.runStatus === 'running') return;
  b.runStatus = 'running'; await saveData(); render(); runPipeline(id);
}
window.startBatch = startBatch;

async function pauseBatch(id) {
  const b = app.batches.find(x => x.id === id);
  if (!b || b.runStatus === 'paused') return;
  b.runStatus = 'paused'; render(); toast('已暂停'); await saveData();
}
window.pauseBatch = pauseBatch;

async function resumeBatch(id) {
  const b = app.batches.find(x => x.id === id);
  if (!b || b.runStatus === 'running') return;
  b.runStatus = 'running'; await saveData(); render(); runPipeline(id);
}
window.resumeBatch = resumeBatch;

async function runPipeline(batchId) {
  if (app.isLoopRunning) return;
  app.isLoopRunning = true;

  try {
    while (true) {
      await fetchData(true); // 此时 fetchData 是纯拉取，不会再乱改状态了
      const b = app.batches.find(x => x.id === batchId);
      if (!b || b.runStatus !== 'running') { app.isLoopRunning = false; return; }

      // 1. 采集
      const toCollect = b.items.filter(i => i.collectStatus === 'pending' || (i.collectStatus === 'error' && (i.retryCount || 0) < 3));
      if (toCollect.length > 0) {
        if (b.externalBatchId) {
           await syncCollectionResult(batchId, b.externalBatchId);
        } else {
           await submitCollectionTask(batchId, toCollect);
        }
        continue;
      }

      // 2. 审核
      const toAudit = b.items.find(i => i.collectStatus === 'collected' && i.reviewStatus === 'pending');
      if (toAudit) {
        await doSingleAudit(batchId, toAudit.itemId);
        continue;
      }

      // 3. 自动清理文案
      const toClean = b.items.find(i => i.reviewStatus === 'passed' && i.copyStatus === 'pending');
      if (toClean) {
        await autoCleanCopy(batchId, toClean.itemId);
        continue;
      }

      // 4. 完成
      b.runStatus = 'completed'; 
      await saveData(); 
      render(); 
      toast('当前批次处理完毕');
      app.isLoopRunning = false; 
      return;
    }
  } catch (e) { 
    toast('调度异常，已停止：' + e.message); 
    const b = app.batches.find(x => x.id === batchId);
    if (b) { b.runStatus = 'paused'; await saveData(); render(); }
    app.isLoopRunning = false; 
  }
}

// ================= 采集逻辑 =================
async function submitCollectionTask(batchId, itemsToCollect) {
  const b = app.batches.find(x => x.id === batchId);
  itemsToCollect.forEach(i => { i.collectStatus = 'collecting'; i.reason = '正在提交...'; });
  await saveData();

  try {
    const asins = itemsToCollect.map(i => i.asin);
    const batchName = `wb_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;
    b.externalBatchId = batchName;
    await saveData();

    const res = await fetchWithTimeout(`${WORKER_URL}/api/batches`, {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Workbench-Token': TOKEN },
      body: JSON.stringify({ asins, batch_name: batchName })
    }, { timeout: 20000 });
    
    if (!res.ok) throw new Error('提交采集失败');

    await syncCollectionResult(batchId, batchName);

  } catch (e) {
    itemsToCollect.forEach(i => { i.collectStatus = 'error'; i.reason = e.message; i.retryCount = (i.retryCount || 0) + 1; });
    b.externalBatchId = null;
    await saveData();
  }
}

async function syncCollectionResult(batchId, externalBatchId) {
  const b = app.batches.find(x => x.id === batchId);
  let itemsToCollect = b.items.filter(i => i.collectStatus === 'collecting' || (i.collectStatus === 'error' && (i.retryCount || 0) < 3));
  
  let isCompleted = false, poll = 0; 
  while (!isCompleted && poll < 60) { // 最多等 120 秒
    await new Promise(r => setTimeout(r, 2000));
    
    const curB = app.batches.find(x => x.id === batchId);
    if (curB.runStatus === 'paused') {
      itemsToCollect.forEach(i => { i.collectStatus = 'pending'; i.reason = '已暂停'; });
      await saveData();
      return;
    }
    
    poll++;
    try {
      const rRes = await fetchWithTimeout(`${WORKER_URL}/api/results?batch_id=${externalBatchId}&limit=100`, { headers: { 'X-Workbench-Token': TOKEN } }, { timeout: 15000 });
      if (rRes.ok) {
        const rData = await rRes.json();
        let arr = Array.isArray(rData) ? rData : (rData.data || rData.records || rData.results || []);
        
        let found = 0;
        itemsToCollect.forEach(item => {
          const match = arr.find(r => JSON.stringify(r).includes(item.asin));
          if (match) {
            item.collected = normalizeCollectedData(match);
            item.collectStatus = 'collected'; 
            item.reason = '采集成功';
            found++;
          }
        });

        if (found === itemsToCollect.length) {
           isCompleted = true; b.externalBatchId = null; break;
        } else {
           itemsToCollect.forEach(i => { if (i.collectStatus === 'collecting') i.reason = `采集中(${poll*2}s)`; });
           if(app.view === 'items' && app.currentBatchId === batchId) renderItems();
        }
      }
    } catch (err) {}
  }

  if (!isCompleted) {
    itemsToCollect.forEach(i => { 
      if (i.collectStatus === 'collecting') {
        i.collectStatus = 'error'; 
        i.reason = '同步结果超时(120s)'; 
        i.retryCount = (i.retryCount || 0) + 1;
      }
    });
    b.externalBatchId = null;
  }
  await saveData();
}

// ================= 审核逻辑 =================
async function doSingleAudit(batchId, itemId) {
  const b = app.batches.find(x => x.id === batchId);
  const item = b.items.find(x => x.itemId === itemId);
  const f = item.collected || {};
  
  if (!(f.title && f.title.length > 3) && !(f.description && f.description.length > 5)) {
    item.reviewStatus = 'skipped'; item.reason = '资料不足'; await saveData(); return;
  }

  item.reviewStatus = 'auditing'; item.reason = 'AI 审核中...';
  if (!await saveData()) return;

  try {
    let allFields = f._raw ? { ...f._raw } : { ...f };
    const res = await fetchWithTimeout(`${WORKER_URL}/api/audit`, {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Workbench-Token': TOKEN },
      body: JSON.stringify({ batchId, itemId, asin: item.asin, fields: allFields })
    }, { timeout: 90000 });

    const data = await res.json();
    if (app.batches.find(x => x.id === batchId).runStatus === 'paused') throw new Error('用户已暂停');

    if (data.error) { item.reviewStatus = 'error'; item.reason = data.detail; }
    else if (data.success && data.audit) {
      item.audit = data.audit;
      item.reviewStatus = data.audit.decision;
      item.reason = data.audit.reason;
      if (item.reviewStatus === 'passed') item.copyStatus = 'pending'; 
    }
  } catch (e) {
    item.reviewStatus = e.message === '用户已暂停' ? 'pending' : 'error';
    item.reason = e.message;
  }
  await saveData();
}

// ================= 文案本地清理逻辑 =================
async function autoCleanCopy(batchId, itemId) {
  const b = app.batches.find(x => x.id === batchId);
  const item = b.items.find(x => x.itemId === itemId);
  const f = item.collected || {};
  
  const brand = f.brand || '';
  const clean = (str) => {
    if (!str) return '';
    let s = String(str);
    if (brand) {
      const regex = new RegExp(brand, 'gi');
      s = s.replace(regex, '');
    }
    s = s.replace(/Amazon|Prime/gi, '');
    return s.replace(/\s+/g, ' ').trim();
  };

  item.copyData = {
    title: clean(f.title),
    bullets: clean(f.bullets),
    description: clean(f.description)
  };
  
  item.copyStatus = 'completed';
  await saveData();
}

// ================= 详情页与操作 =================
function openDetail(itemId) {
  app.detailItemId = itemId;
  const b = app.batches.find(x => x.id === app.currentBatchId);
  const item = b.items.find(x => x.itemId === itemId);
  if (!item) return;
  $('dtTitle').textContent = item.asin + ' · 商品详情';
  
  let rTag = '待处理', rCls = 'b-gray';
  if (item.reviewStatus === 'passed') { rTag = '已通过'; rCls = 'b-pass'; }
  if (item.reviewStatus === 'verify') { rTag = '待核验'; rCls = 'b-warn'; }
  if (item.reviewStatus === 'excluded') { rTag = '已排除'; rCls = 'b-err'; }
  if (item.reviewStatus === 'error') { rTag = '失败'; rCls = 'b-err'; }
  $('dtStatus').textContent = rTag;
  $('dtStatus').className = `badge ${rCls}`;

  const a = item.audit || {};
  let html = `<div class="detail-grid"><div><div class="section-box"><h4>原始资料</h4>
    <div class="field"><div class="label">标题</div><div class="text">${esc(item.collected?.title || '未采集')}</div></div>
    <div class="field"><div class="label">五点</div><div class="text">${esc(item.collected?.bullets || '未采集')}</div></div>
  </div></div><div>`;

  if (item.reviewStatus === 'skipped') {
    html += `<div class="section-box"><h4>资料不足</h4><p>未调用 AI 审核。</p></div>`;
  } else if (item.audit) {
    html += `<div class="section-box" style="background:#f9fbf9">
      <h4>AI 审核结论</h4>
      <div class="field"><div class="label">理由</div><div class="text">${esc(a.reason)}</div></div>
      <div class="field"><div class="label">证据</div><div class="text">${esc(a.product_evidence || '-')}</div></div>
    </div>`;
  }

  if (item.reviewStatus === 'verify') {
    html += `<div class="section-box" style="background:#fffbf2">
      <h4>人工核验</h4>
      <div class="form-group"><label>依据（必填）</label><textarea id="dtReviewReason" rows="2"></textarea></div>
      <button class="primary" onclick="saveDetailVerify('passed')">确认通过</button>
      <button class="danger" onclick="saveDetailVerify('excluded')">排除</button>
    </div>`;
  }

  if (item.copyStatus === 'completed') {
    html += `<div class="section-box" style="background:#e7f4ec"><h4>已自动清理，可导出</h4><p>标题: ${esc(item.copyData?.title)}</p></div>`;
  }

  html += `</div></div>`;
  $('dtBody').innerHTML = html;
  $('dtFooter').innerHTML = `<button data-close>关闭</button>`;
  $('detailDialog').showModal();
}

async function saveDetailVerify(decision) {
  const b = app.batches.find(x => x.id === app.currentBatchId);
  const item = b.items.find(x => x.itemId === app.detailItemId);
  const reason = $('dtReviewReason').value.trim();
  if (!reason) return toast('请填写人工核验依据。');
  
  item.reviewStatus = decision;
  item.reason = '人工' + (decision === 'passed' ? '通过' : '排除') + ': ' + reason;
  if (decision === 'passed') item.copyStatus = 'pending';
  
  if (await saveData()) { toast('结论已保存'); renderItems(); openDetail(item.itemId); }
}
window.saveDetailVerify = saveDetailVerify;

// ================= 导出与导入 =================
$('exportBatchBtn').onclick = () => {
  const b = app.batches.find(x => x.id === app.currentBatchId);
  if (!b) return toast('无批次可导出');
  const items = b.items.filter(i => i.reviewStatus === 'passed' && i.copyStatus === 'completed');
  if (!items.length) return toast('没有已通过且文案完成的商品');

  const headers = ['SKU'];
  if (exportPrefs.link) headers.push('链接');
  if (exportPrefs.title) headers.push('标题');
  if (exportPrefs.bullets) headers.push('五点');
  if (exportPrefs.desc) headers.push('长描述');

  const rows = [headers];
  items.forEach(i => {
    const row = [i.asin];
    if (exportPrefs.link) row.push(`https://www.amazon.com/dp/${i.asin}`);
    if (exportPrefs.title) row.push(i.copyData?.title || i.collected?.title || '');
    if (exportPrefs.bullets) row.push(i.copyData?.bullets || i.collected?.bullets || '');
    if (exportPrefs.desc) row.push(i.copyData?.description || i.collected?.description || '');
    rows.push(row);
  });

  const ws = XLSX.utils.aoa_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "通过商品");
  XLSX.writeFile(wb, `批次导出_${b.name}.xlsx`);
  toast('已生成 Excel 下载');
};

$('importBtn').onclick = () => { $('inputBatchName').value = ''; $('skuInput').value = ''; $('goodsFile').value = ''; $('importError').textContent = ''; $('importSummary').innerHTML = '待导入数量：0 个'; $('importDialog').showModal(); };
$('goodsFile').onchange = async (e) => {
  const file = e.target.files[0]; if (!file) return;
  try {
    const b = await file.arrayBuffer(); const wb = XLSX.read(b, {type:'array'}); const sheet = wb.Sheets[wb.SheetNames[0]]; const rows = XLSX.utils.sheet_to_json(sheet, {header:1, defval:''});
    const extracted = [];
    for (let i = 1; i < rows.length; i++) { const a = asin(rows[i][0]); if (a) extracted.push(a); }
    window._fileAsins = extracted;
    $('importSummary').innerHTML = `已读取文件，待合并导入：<strong>${extracted.length}</strong> 个`;
  } catch (err) { $('importError').textContent = err.message; }
};
$('btnConfirmImport').onclick = async () => {
  const textAsins = $('skuInput').value.split(/[\s,;，；]+/).map(v => asin(v)).filter(Boolean);
  const fileAsins = window._fileAsins || [];
  const allAsins = [...new Set([...textAsins, ...fileAsins])];
  if (!allAsins.length) return $('importError').textContent = '无有效SKU';
  const bName = $('inputBatchName').value.trim() || '批次_' + new Date().toLocaleDateString().replace(/\//g,'');
  const items = allAsins.map(a => ({ itemId: 'itm_' + Math.random().toString(36).slice(2, 9), asin: a, collectStatus: 'pending', reviewStatus: 'pending', copyStatus: 'pending', reason: '等待处理' }));
  const newB = { id: 'b_' + Date.now(), name: bName, createdAt: new Date().toISOString(), runStatus: 'running', items };
  app.batches.push(newB);
  $('btnConfirmImport').disabled = true;
  const ok = await saveData();
  $('btnConfirmImport').disabled = false;
  if (ok) { 
    $('importDialog').close(); 
    window._fileAsins = []; 
    renderHome();
    runPipeline(newB.id);
  }
};

$('btnBatchRetry').onclick = async () => {
  const b = app.batches.find(x => x.id === app.currentBatchId);
  if (!b) return;
  let count = 0;
  b.items.forEach(i => {
    if (i.collectStatus === 'error' && (i.retryCount || 0) < 3) { i.collectStatus = 'pending'; count++; }
    if (i.reviewStatus === 'error') { i.reviewStatus = 'pending'; count++; }
  });
  if (count > 0) {
    b.externalBatchId = null; 
    b.runStatus = 'running'; await saveData(); renderItems(); toast(`开始重试 ${count} 个任务`); runPipeline(b.id);
  } else { toast('没有可重试的失败任务'); }
};

$('backHomeBtn').onclick = goHome;
document.querySelectorAll('[data-close]').forEach(btn => { btn.onclick = (e) => e.target.closest('dialog').close(); });
$('btnSettings').onclick = () => $('settingsDialog').showModal();
$('settingsDialog').querySelector('.primary').onclick = () => {
  exportPrefs = { link: $('expLink').checked, title: $('expTitle').checked, bullets: $('expBullets').checked, desc: $('expDesc').checked };
  localStorage.setItem('ebay_export_prefs', JSON.stringify(exportPrefs));
  toast('设置已保存');
};

init();
</script>
