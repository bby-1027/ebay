<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>商品审核工作台</title>
<style>
:root{font-family:Inter,"Microsoft YaHei",system-ui,sans-serif;color:#23332f;background:#f5f7f6;font-size:14px;--green:#216b52;--line:#e2e8e4;--muted:#748079;--bg:#f9fbf9;}
*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:8px;padding:10px 15px;background:white;color:inherit;transition:all .2s}button:hover{background:#f1f6f3}button:disabled{cursor:not-allowed;opacity:.5}.primary{background:var(--green);border-color:var(--green);color:white}.primary:hover{background:#17583f}.danger{color:#a53d38;border-color:#fceceb}.danger:hover{background:#fceceb}.linkbtn{border:0;background:transparent;color:var(--green);padding:0;font-size:13px}.linkbtn:hover{text-decoration:underline;background:transparent}
header{height:82px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(24px,calc((100vw - 1260px)/2))}
.brand{display:flex;align-items:center;gap:12px}.logo{background:var(--green);color:white;border-radius:10px;padding:10px;font-weight:800;font-size:18px}h1{font-size:19px;margin:0 0 4px}h2{font-size:20px;margin:0 0 12px;display:flex;align-items:center;gap:12px}
main{max-width:1260px;padding:30px 24px 64px;margin:auto}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.card{background:white;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:20px}
.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;text-align:left;white-space:normal}th{background:#f7f9f7;color:#75817b;font-weight:500;font-size:12px}th,td{padding:14px 16px;border-bottom:1px solid #edf0ed;vertical-align:middle}td{font-size:13px}
.title-col{max-width:320px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-overflow:ellipsis}
.badge{display:inline-block;white-space:nowrap;padding:3px 8px;border-radius:4px;font-size:12px;border:1px solid transparent}
.b-pass{background:#e7f4ec;color:#28714a;border-color:#c3e6d3}.b-warn{background:#fff3dd;color:#966314;border-color:#f2d8a6}.b-err{background:#fceceb;color:#a34f48;border-color:#f2cac7}.b-run{background:#e9f0fb;color:#4265a0;border-color:#c3d4f2}.b-gray{background:#f0f2f0;color:#748079;border-color:#e2e5e2}
.toolbar{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#f9fbf9;border-bottom:1px solid var(--line);flex-wrap:wrap;gap:10px}
.batch-bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.search-input{width:220px;padding:8px 12px;border:1px solid var(--line);border-radius:6px}
dialog{border:1px solid var(--line);border-radius:14px;padding:0;max-width:calc(100vw - 28px);max-height:90vh;box-shadow:0 20px 80px #193d2526;width:1000px;margin:auto}
dialog::backdrop{background:#1c332c66}.dialoghead{padding:16px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:white;z-index:2}.dialoghead h3{font-size:17px;margin:0}.close{border:0;padding:4px 9px;font-size:22px}
.dialogbody{padding:24px}.dialogfoot{display:flex;justify-content:flex-end;gap:10px;padding:16px 24px;border-top:1px solid var(--line);background:#fafbf9;position:sticky;bottom:0}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.field{margin-bottom:16px}.field .label{color:var(--muted);font-size:12px;margin-bottom:6px}.text{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6;font-size:13px;max-height:300px;overflow-y:auto;background:#f7f9f6;padding:10px;border-radius:6px;border:1px solid #eef1ee}
.section-box{border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:20px;background:white}.section-box h4{margin:0 0 12px;font-size:14px;color:#334239;border-left:3px solid var(--green);padding-left:8px}
.form-group label{display:block;margin-bottom:6px;font-size:13px;font-weight:500}.form-group textarea,.form-group select,.form-group input[type=text]{width:100%;border:1px solid var(--line);border-radius:6px;padding:10px;margin-bottom:12px;resize:vertical}
.hidden{display:none!important}
#toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);padding:12px 20px;background:#243b30;color:white;border-radius:6px;z-index:100;display:none;box-shadow:0 5px 20px rgba(0,0,0,0.2)}
.checkbox-cell{width:40px;text-align:center}
</style>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" defer></script>
</head>
<body>
<header>
  <div class="brand"><div class="logo">✓</div><div><h1>商品审核工作台</h1><small>批次管理 · 风险审核 · 导出</small></div></div>
  <div>
    <button id="btnSyncPolicies" style="margin-right: 10px;">同步政策</button>
    <button id="btnSettings">设置</button>
  </div>
</header>
<main>
  <!-- 视图1：批次首页 -->
  <div id="homeView">
    <div class="actions" style="justify-content:space-between;margin-bottom:20px">
      <h2>批次列表</h2>
      <button id="importBtn" class="primary">＋ 导入新批次</button>
    </div>
    <div class="card">
      <div class="tablewrap">
        <table>
          <thead><tr><th>批次名称 / 导入时间</th><th>商品数量</th><th>批次状态</th><th>待核验</th><th>失败</th><th>可导出</th><th>操作</th></tr></thead>
          <tbody id="batchRows"><tr><td colspan="7" style="text-align:center;padding:20px">加载数据中...</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- 视图2：SKU 明细 -->
  <div id="itemsView" class="hidden">
    <div class="actions" style="margin-bottom:20px">
      <button id="backHomeBtn">← 返回批次列表</button>
      <h2 id="currentBatchName" style="margin:0"></h2>
    </div>
    
    <div class="card">
      <div class="toolbar">
        <div class="batch-bar">
          <button id="btnBatchCollect">批量采集</button>
          <button id="btnBatchRetry">重试采集失败</button>
          <button id="btnBatchExclude" class="danger">批量排除</button>
        </div>
        <div style="display:flex;gap:10px">
          <input type="text" id="searchInput" class="search-input" placeholder="搜索 SKU 或标题">
          <select id="filterStatus" class="search-input" style="width:130px">
            <option value="all">全部状态</option>
            <option value="collect_pending">待采集</option>
            <option value="collect_error">采集失败</option>
            <option value="review_pending">待审核</option>
            <option value="review_verify">待核验</option>
            <option value="review_passed">已通过</option>
            <option value="review_excluded">已排除</option>
            <option value="copy_verify">文案待核验</option>
          </select>
        </div>
      </div>
      
      <!-- 选中操作栏 -->
      <div id="selectionBar" class="toolbar hidden" style="background:#eaf2ed;border-bottom:1px solid #c3e6d3">
        <div>已选择 <strong id="selCount">0</strong> 个商品</div>
        <div style="display:flex;gap:10px">
          <button id="btnSelExclude" class="danger">排除所选</button>
          <button id="btnSelPass">批量通过</button>
          <button id="btnSelCancel">取消选择</button>
        </div>
      </div>

      <div class="tablewrap">
        <table>
          <thead>
            <tr>
              <th class="checkbox-cell"><input type="checkbox" id="selectAll"></th>
              <th>SKU</th><th>商品标题</th><th>采集状态</th><th>审核 / 文案状态</th><th>原因 / 待办</th><th>操作</th>
            </tr>
          </thead>
          <tbody id="itemRows"></tbody>
        </table>
      </div>
      <div style="padding:12px 16px;text-align:center;border-top:1px solid var(--line);background:#f9fbf9">
        <button id="btnSelectAllFiltered" class="linkbtn">选中全部筛选结果</button>
      </div>
    </div>
  </div>
</main>

<!-- 导入弹窗 (统一窗口) -->
<dialog id="importDialog">
  <div class="dialoghead"><h3>导入新批次</h3><button class="close" data-close>×</button></div>
  <div class="dialogbody">
    <div style="margin-bottom:15px">
      <label>批次名称（可选）</label>
      <input type="text" id="inputBatchName" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:6px" placeholder="不填则自动按日期生成">
    </div>
    
    <div style="margin-bottom:10px;font-weight:500">SKU 列表</div>
    <textarea id="skuInput" style="width:100%;height:150px;border:1px solid var(--line);border-radius:6px;padding:10px;font-family:monospace;margin-bottom:15px" placeholder="每行一个亚马逊 ASIN..."></textarea>
    
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:15px">
      <span style="color:var(--muted)">或</span>
      <input type="file" id="goodsFile" accept=".xlsx,.xls,.csv" style="font-size:13px">
    </div>
    
    <div id="importSummary" style="background:#f0f4f1;padding:10px;border-radius:6px;font-size:13px;margin-bottom:15px">
      待导入数量：0 个
    </div>
    <div id="importError" style="color:#a53d38;font-size:13px;margin-top:10px"></div>
  </div>
  <div class="dialogfoot"><button data-close>取消</button><button id="btnConfirmImport" class="primary">确认导入</button></div>
</dialog>

<!-- 商品详情弹窗 -->
<dialog id="detailDialog">
  <div class="dialoghead">
    <div><h3 id="dtTitle" style="margin-bottom:4px">商品详情</h3><span id="dtStatus" class="badge b-gray"></span></div>
    <button class="close" data-close>×</button>
  </div>
  <div id="dtBody" class="dialogbody"></div>
  <div class="dialogfoot" id="dtFooter"></div>
</dialog>

<!-- 设置弹窗 -->
<dialog id="settingsDialog" style="width:400px">
  <div class="dialoghead"><h3>设置</h3><button class="close" data-close>×</button></div>
  <div class="dialogbody">
    <div class="section-box">
      <h4>导出字段设置</h4>
      <p class="muted" style="font-size:12px;margin-bottom:12px">此设置仅保存在本浏览器，不影响其他人。</p>
      <label style="display:block;margin-bottom:8px"><input type="checkbox" checked disabled> SKU（必选）</label>
      <label style="display:block;margin-bottom:8px"><input type="checkbox" id="expLink" checked> 亚马逊链接</label>
      <label style="display:block;margin-bottom:8px"><input type="checkbox" id="expTitle" checked> 清理后的标题</label>
      <label style="display:block;margin-bottom:8px"><input type="checkbox" id="expBullets" checked> 清理后的五点描述</label>
      <label style="display:block;margin-bottom:8px"><input type="checkbox" id="expDesc" checked> 清理后的长描述</label>
    </div>
  </div>
  <div class="dialogfoot"><button class="primary" data-close>保存</button></div>
</dialog>

<!-- 批量排除原因弹窗 -->
<dialog id="excludeDialog">
  <div class="dialoghead"><h3>批量排除所选商品</h3><button class="close" data-close>×</button></div>
  <div class="dialogbody">
    <div class="form-group">
      <label>排除原因（必填）</label>
      <textarea id="excludeReason" rows="3"></textarea>
    </div>
  </div>
  <div class="dialogfoot"><button data-close>取消</button><button id="btnConfirmExclude" class="primary danger">确认排除</button></div>
</dialog>

<div id="toast"></div>

<script>
'use strict';

// ==========================================
// 【请在这里填写你的配置】
const WORKER_URL = 'https://scraper-proxy.1172743763.workers.dev';
const TOKEN = 'ebay1031'; // 替换为你真实的 WORKBENCH_TOKEN
// ==========================================

// ========== 状态管理 ==========
let app = {
  serverVersion: 0,
  batches: [],
  currentBatchId: null,
  view: 'home',
  searchQuery: '',
  filterStatus: 'all',
  selectedItemIds: new Set(),
  detailItemId: null
};

let exportPrefs = {
  link: true, title: true, bullets: true, desc: true
};

// ========== 工具函数 ==========
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const text = v => Array.isArray(v) ? v.map(text).join('\n') : (v && typeof v === 'object' ? JSON.stringify(v, null, 2) : String(v ?? ''));
const meaningful = v => !['', 'n/a', 'na', 'null', 'none', '未提供'].includes(text(v).trim().toLowerCase());
function asin(v) { const s = text(v).trim().toUpperCase(); return /^[A-Z0-9]{10}$/.test(s) ? s : null; }

function toast(msg) {
  const el = $('toast'); el.textContent = msg; el.style.display = 'block';
  clearTimeout(el.timer); el.timer = setTimeout(() => el.style.display = 'none', 4000);
}

// 自适应解析采集系统返回的字段
function normalizeCollectedData(raw) {
  const target = raw.data || raw.product || raw.item || raw;
  let descValue = target.description || target['长描述'] || target['商品描述'] || target['描述'] || '';
  
  if (!descValue) {
    for (const key in target) {
      const lowerKey = key.toLowerCase();
      if ((lowerKey.includes('desc') || key.includes('描述')) && typeof target[key] === 'string' && target[key].length > 10) {
        descValue = target[key];
        break;
      }
    }
  }

  return {
    title: target.title || target['商品标题'] || target['标题'] || '',
    brand: target.brand || target['品牌'] || '',
    bullets: target.bullets || target['五点描述'] || target['卖点'] || target.bullet_points || target['五点'] || '',
    description: descValue,
    images: target.images || target['商品图片'] || target['图片链接'] || target.imageurls || '',
    category: target.category || target['商品类型'] || target['类目路径'] || '',
    model: target.model || target['产品型号'] || '',
    variants: target.variants || target['变体属性'] || '',
    condition: target.condition || target['品相'] || target['成色'] || '',
    stockStatus: target.stockStatus || target['库存状态'] || '',
    _raw: raw
  };
}

// ========== 网络请求：读写数据 ==========
async function fetchData() {
  try {
    const res = await fetch(`${WORKER_URL}/api/data`, { headers: { 'X-Workbench-Token': TOKEN } });
    if (!res.ok) throw new Error('获取数据失败: ' + res.status);
    const data = await res.json();
    app.serverVersion = data.version || 0;
    app.batches = data.batches || [];
    render();
  } catch (e) {
    toast(e.message);
  }
}

async function saveData() {
  try {
    const payload = { version: app.serverVersion,
