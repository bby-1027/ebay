<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>商品审核工作台</title>
<style>
:root{font-family:Inter,"Microsoft YaHei",system-ui,sans-serif;color:#23332f;background:#f5f7f6;font-size:14px;--green:#216b52;--line:#e2e8e4;--muted:#748079;--bg:#f9fbf9;}
*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:8px;padding:10px 15px;background:white;color:inherit;transition:all .2s}button:hover{background:#f1f6f3}button:disabled{cursor:not-allowed;opacity:.5}.primary{background:var(--green);border-color:var(--green);color:white}.primary:hover{background:#17583f}.danger{color:#a53d38;border-color:#fceceb}.danger:hover{background:#fceceb}.linkbtn{border:0;background:transparent;color:var(--green);padding:0;font-size:13px}.linkbtn:hover{text-decoration:underline;background:transparent}
header{height:82px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(24px,calc((100vw - 1260px)/2))}
.brand{display:flex;align-items:center;gap:12px}.logo{background:var(--green);color:white;border-radius:10px;padding:10px;font-weight:800;font-size:18px}h1{font-size:19px;margin:0 0 4px}h2{font-size:20px;margin:0 0 12px;display:flex;align-items:center;gap:12px}
main{max-width:1260px;padding:30px 24px 64px;margin:auto}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.card{background:white;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:20px}
.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;text-align:left;white-space:normal}th{background:#f7f9f7;color:#75817b;font-weight:500;font-size:12px}th,td{padding:14px 16px;border-bottom:1px solid #edf0ed;vertical-align:middle}td{font-size:13px}
#itemRows tr:hover>td{background:#edf7f1}
.title-col{max-width:320px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-overflow:ellipsis}
.badge{display:inline-block;white-space:nowrap;padding:3px 8px;border-radius:4px;font-size:12px;border:1px solid transparent}
.b-pass{background:#e7f4ec;color:#28714a;border-color:#c3e6d3}.b-warn{background:#fff3dd;color:#966314;border-color:#f2d8a6}.b-err{background:#fceceb;color:#a34f48;border-color:#f2cac7}.b-run{background:#d9e9ff;color:#175cbe;border-color:#9fc5fa}.b-wait{background:#eff8ff;color:#5884a5;border-color:#d7eafb}.b-gray{background:#f0f2f0;color:#748079;border-color:#e2e5e2}
.toolbar{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#f9fbf9;border-bottom:1px solid var(--line);flex-wrap:wrap;gap:10px}
.batch-bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.search-input{width:220px;padding:8px 12px;border:1px solid var(--line);border-radius:6px}
dialog{border:1px solid var(--line);border-radius:14px;padding:0;max-width:calc(100vw - 28px);max-height:90vh;box-shadow:0 20px 80px #193d2526;width:1000px;margin:auto}
dialog::backdrop{background:#1c332c66}.dialoghead{padding:16px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:white;z-index:2}.dialoghead h3{font-size:17px;margin:0}.close{border:0;padding:4px 9px;font-size:22px}
.dialogbody{padding:24px}.dialogfoot{display:flex;justify-content:flex-end;gap:10px;padding:16px 24px;border-top:1px solid var(--line);background:#fafbf9;position:sticky;bottom:0}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.field{margin-bottom:16px}.field .label{color:var(--muted);font-size:12px;margin-bottom:6px}.text{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6;font-size:13px;max-height:300px;overflow-y:auto;background:#f7f9f6;padding:10px;border-radius:6px;border:1px solid #eef1ee}
.section-box{border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:20px;background:white}.section-box h4{margin:0 0 12px;font-size:14px;color:#334239;border-left:3px solid var(--green);padding-left:8px}
.form-group label{display:block;margin-bottom:6px;font-size:13px;font-weight:500}.form-group textarea,.form-group select,.form-group input[type=text]{width:100%;border:1px solid var(--line);border-radius:6px;padding:10px;margin-bottom:12px;resize:vertical}
.hidden{display:none!important}
#toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);padding:12px 20px;background:#243b30;color:white;border-radius:6px;z-index:100;display:none;box-shadow:0 5px 20px rgba(0,0,0,0.2)}

.review-card{border:1px solid var(--line);border-radius:10px;padding:16px;background:#fff}
.review-card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.review-column .review-card-head h4{border-left:3px solid #206952;padding-left:8px;margin:0;white-space:nowrap}
.review-card-head .badge{flex:none}
.review-card .field{margin:0 0 14px}
.review-card .field .text{padding:9px 10px;background:#f5f7f6;border:1px solid #e9efeb;border-radius:6px}
.review-note small{display:block;margin-top:6px;line-height:1.45}
.review-note .manual-status-select{display:block;width:100%;min-height:42px;margin-top:6px;padding:9px 12px;border:1px solid #dfe8e2;border-radius:6px;background:#f5f7f6;color:inherit;cursor:pointer}
.manual-status-select:hover:not(:disabled){border-color:#93b3a3}
.manual-status-select:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.manual-status-select:disabled{opacity:.6;cursor:not-allowed}
.review-card .review-questions .text{color:#8a540d;background:#fff8ec;border-color:#f3e3ca}
.policy-summary{list-style:none;padding:0;margin:4px 0 8px;font-size:13px;line-height:1.55}
.policy-summary li+li{margin-top:3px}
.review-card details>summary{cursor:pointer;color:#245c4d;font-size:13px}
.review-card .audit-basis{margin:0}
.home-progress{white-space:nowrap}
</style>

<style>
[hidden]{display:none!important}small,.muted{color:var(--muted)}.row-actions{white-space:nowrap}.row-actions button{margin-right:10px}.short-reason{max-width:340px;-webkit-line-clamp:1}
.batch-heading{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:16px;flex-wrap:wrap}.batch-heading h2{margin:0}.batch-heading .left,.batch-heading .right{display:flex;align-items:center;gap:12px}.batch-meta{color:var(--muted);font-size:12px;margin:0 0 16px}
.selection-strip{display:flex;gap:14px;align-items:center;padding:9px 16px;color:var(--muted);font-size:12px}.options-menu{position:relative;margin-left:18px}.options-menu>summary{list-style:none}.options-menu>summary::-webkit-details-marker{display:none}.options-menu>summary::after{content:" ▾"}.options-menu>summary{padding:9px;color:var(--muted)}.options-menu[open]>div{position:absolute;right:0;top:42px;min-width:170px;z-index:5;background:white;border:1px solid var(--line);border-radius:8px;padding:8px;box-shadow:0 4px 12px #0001}.options-menu button{display:block;border:0;width:100%;text-align:left}
dialog[open]{display:flex;flex-direction:column;width:760px;overflow:hidden}dialog .dialoghead,dialog .dialogfoot{flex-shrink:0;position:static}dialog .dialogbody{min-height:0;overflow-y:auto;overflow-x:hidden}.dialoghead>div{min-width:0}.dialoghead h3{overflow-wrap:anywhere}#dtStatus{margin-top:6px;white-space:normal;max-width:100%}.compact-detail{min-width:0}.compact-detail .text{max-height:none;overflow:visible;background:transparent;border:0;padding:0;font-size:14px}.compact-detail>.field{padding:14px;background:#f7f9f7;border-radius:8px}.product-heading{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:18px;font-size:13px;color:var(--muted)}.product-heading span{overflow-wrap:anywhere;min-width:0}.product-heading a{flex-shrink:0}.compact-detail details{border-top:1px solid var(--line);padding-top:14px}.panel-content{padding-top:14px;min-width:0}.panel-content .text{white-space:pre-wrap;overflow-wrap:anywhere}.product-thumb{width:90px;height:90px;object-fit:contain;margin:5px}.manual-box{margin:18px 0}.advanced{color:var(--muted)}.advanced .row-actions{margin:12px 0}#pagination{justify-content:flex-end}.sku{white-space:nowrap}.search-input{width:300px}
@media(max-width:760px){.batch-heading .left{flex-wrap:wrap}.search-input{width:100%}.product-heading{display:block}.product-heading a{display:block;margin-top:8px}.toolbar>div{width:100%}}
#detailDialog[open]{width:1120px}#detailDialog .dialoghead{padding:18px 24px}.detail-id-line{display:flex;align-items:center;gap:12px}.detail-id-line #dtStatus{margin:0}#detailMeta{display:flex;align-items:center;gap:18px;color:var(--muted);font-size:13px;margin-top:8px}#detailMeta strong{color:#23332f;font-weight:500}.review-layout{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,1fr);gap:28px}.product-column,.review-column{min-width:0}.product-column{padding-right:24px;border-right:1px solid var(--line)}.review-column h4{margin:0 0 18px;font-size:16px}.review-layout .field{margin-bottom:20px}.review-layout .label{font-size:12px;color:var(--muted);margin-bottom:7px}.review-layout .text{max-height:none;overflow:visible;background:transparent;border:0;padding:0;font-size:14px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere}.review-column>.field{padding:14px;background:#f7f9f7;border-radius:8px}.detail-tabs{display:flex;gap:8px;border-bottom:1px solid var(--line);margin-bottom:20px;padding-bottom:8px}.detail-tabs button{border:0;color:var(--muted);background:transparent}.detail-tabs button[aria-selected="true"]{background:#e7f4ec;color:var(--green);font-weight:600}.readable-field .text-expander{margin-top:6px}.review-note{margin:20px 0}.review-note label{display:block;font-size:13px;margin-bottom:8px}.review-note textarea,.review-layout textarea{display:block;box-sizing:border-box;width:100%;min-height:104px;border:1px solid var(--line);border-radius:8px;padding:12px;resize:vertical;font:inherit;line-height:1.6;margin:8px 0 16px}.review-column details{border-top:1px solid var(--line);padding-top:12px}.review-column summary{font-size:13px}.product-images{margin-top:16px}#dtFooter{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}.detail-navigation,.detail-main-actions{display:flex;align-items:center;gap:10px}.detail-navigation span{font-size:12px;color:var(--muted);min-width:45px;text-align:center}.detail-navigation button{padding:9px 12px}.short-reason{display:block;max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#settingsError:empty,#settingsConfirmError:empty{display:none}#settingsError,#settingsConfirmError{color:#a53d38;font-size:13px}#settingsConfirmDialog .dialogfoot{flex-wrap:wrap}#settingsConfirmDialog{width:440px}
@media(max-width:850px){.review-layout{grid-template-columns:1fr}.product-column{border-right:0;padding-right:0;border-bottom:1px solid var(--line);padding-bottom:20px}#dtFooter{justify-content:flex-end}.detail-navigation{margin-right:auto}#detailMeta{flex-wrap:wrap;gap:10px}#detailDialog .dialoghead{padding:14px 18px}}
</style><style>
#detailDialog[open]{height:min(88vh,920px);display:flex;flex-direction:column}
#dtBody{flex:1;min-height:0;overflow:hidden}
.review-layout{height:100%;min-height:0}
.product-column,.review-column{min-height:0;overflow-y:auto;scrollbar-gutter:stable}
.product-column{padding-right:22px}.review-column{padding-right:8px}
.audit-basis{margin:24px 0}.audit-basis>summary{font-size:15px;font-weight:600;cursor:pointer}
.batch-retry-actions{display:flex;flex-wrap:wrap;gap:8px}
.policy-reference{padding:12px 0;border-top:1px solid var(--line);font-size:13px;line-height:1.7}
.policy-title{font-weight:600}.policy-title a{font-size:12px;font-weight:400;margin-left:8px}
.policy-reference p{margin:8px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.audit-check .field{margin:8px 0}.audit-check .text{white-space:pre-wrap;overflow-wrap:anywhere}
.policy-reference small,.audit-version{font-size:11px;color:var(--muted)}
.policy-explanation{color:#38534a}.check-tags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.check-tag{font-size:11px;padding:4px 7px;border-radius:4px;background:#edf5f0;color:#23664f}.check-attention{background:#fff3df;color:#8b561c}
.review-column .policy-source-text{border:0;padding:0}.policy-source-text summary{font-size:11px;color:var(--muted)}
.provided-rules ul{max-height:220px;overflow:auto;margin:10px 0;padding-left:18px}.provided-rules li{font-size:12px;line-height:1.8}
.audit-version{overflow-wrap:anywhere}.advanced{margin-top:18px}.advanced .row-actions{flex-wrap:wrap;gap:8px}
#detailEditPanel[hidden]{display:none}.product-images{display:flex;flex-wrap:wrap;gap:8px}.product-images>.label{width:100%}
.product-image{position:relative;display:inline-flex;align-items:center;justify-content:center;width:100px;height:106px}
.product-image .product-thumb{margin:0}.image-load{position:absolute;bottom:2px;left:4px;right:4px;padding:6px 3px;font-size:12px;background:rgba(255,255,255,.96);opacity:0;pointer-events:none}
.product-image:hover .image-load,.product-image:focus-within .image-load{opacity:1;pointer-events:auto}
#imagePreviewDialog{width:min(94vw,1100px);height:min(92vh,1000px);padding:0;max-height:94vh}
#imagePreviewDialog[open]{display:flex;flex-direction:column}.image-preview-body{flex:1;min-height:0;overflow:auto;text-align:center;padding:12px}
#previewImage{display:block;max-width:100%;max-height:72vh;object-fit:contain;margin:auto}#previewImage[hidden]{display:none}#previewStatus:empty{display:none}
@media(hover:none){.image-load{opacity:1;pointer-events:auto}}
@media(max-width:850px){#dtBody{overflow:auto}.review-layout{height:auto}.product-column,.review-column{overflow:visible}.product-column{padding-right:0}.review-column{padding-right:0}}

</style>
<style>
.batch-manage-bar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;padding:12px 14px;background:#fff;border:1px solid var(--line);border-radius:8px;margin-bottom:14px}
.batch-manage-bar[hidden]{display:none}.batch-manage-bar>div,.batch-trash-tools{display:flex;align-items:center;flex-wrap:wrap;gap:12px}.batch-trash-tools{margin:12px 0 18px}
.danger-text{color:#a53d38}.danger-button{color:#a53d38;border-color:#d7aaa4;background:#fff}#batchSelectedCount,#trashSelectedCount{font-size:12px;color:var(--muted)}
#batchAdminDialog{width:560px}#batchAdminNames{max-height:150px;overflow:auto;padding-left:22px;font-size:13px;line-height:1.8}#batchAdminNames:empty{display:none}
#batchAdminPassword{box-sizing:border-box;width:100%;margin:10px 0 4px}#batchAdminError{color:#a53d38;font-size:13px;white-space:pre-wrap}#batchAdminError:empty{display:none}
#batchTrashDialog{width:1000px}#batchTrashDialog .dialogbody{max-height:65vh;overflow:auto}#batchTrashDialog td{white-space:normal;font-size:13px}#batchAdminDialog .dialogfoot{gap:10px}
@media(max-width:650px){.batch-manage-bar>div{width:100%}.batch-trash-tools{gap:8px}#batchTrashDialog .dialogbody{padding:14px}}
</style>
<style>
.seller-review{margin:18px 0;padding:16px;border:1px solid var(--line);border-radius:10px;background:#fafcfb}.seller-review h4{margin:0 0 14px}.seller-review .field{margin-bottom:14px}.seller-review .text{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65}.policy-reference p{overflow-wrap:anywhere}.policy-title small{display:inline-block;color:var(--muted);font-weight:400}.review-column .audit-version{line-height:1.7}

</style>
<script src="./vendor/xlsx.full.min.js"></script>
</head>
<body>
<header><div class="brand"><div class="logo">✓</div><div><h1>商品审核工作台</h1><small>批次管理 · 风险审核 · 导出</small></div></div><button id="btnSettings">设置</button></header>
<div id="connectionBanner" role="status" aria-live="polite" style="max-width:1212px;margin:16px auto 0;padding:12px 16px;border:1px solid #e2e8e4;border-radius:8px;background:#fff">
  <span id="connectionMessage">正在连接并读取已保存批次…</span>
  <button id="connectionRetry" type="button" style="margin-left:12px" hidden>重新连接</button>
</div>
<main>
<section id="homeView">
  <div class="batch-heading"><h2>批次列表</h2><div class="right"><button id="batchManageBtn">批次管理</button><button id="refreshState">刷新状态</button><button id="importBtn" class="primary">＋ 导入新批次</button></div></div>
<div id="batchManageBar" class="batch-manage-bar" hidden><div><button id="selectAllBatches" class="linkbtn">全选可删除批次</button><button id="clearBatchSelection" class="linkbtn">取消选择</button><span id="batchSelectedCount"></span></div><div><button id="deleteSelectedBatches" class="danger-button" disabled>删除已选批次</button><button id="openBatchTrash">回收站</button></div></div>
  <div class="card"><div class="tablewrap"><table><thead><tr><th>批次名称 / 导入时间</th><th>商品数</th><th>状态</th><th>进度</th><th>可导出</th><th>操作</th></tr></thead><tbody id="batchRows"><tr><td colspan="6">正在读取已保存批次…</td></tr></tbody></table></div></div>
</section>
<section id="itemsView" class="hidden">
  <div class="batch-heading"><div class="left"><button id="backHomeBtn">← 返回</button><h2 id="currentBatchName"></h2></div><div class="right"><button id="btnRunBatch" class="primary">开始处理</button><button id="btnExportItems">导出通过</button><details class="options-menu" id="batchMore"><summary>更多</summary><div><button id="renameBatch">重命名批次</button><button id="btnExportFailures">导出失败清单</button></div></details></div></div>
  <p id="batchProgress" class="batch-meta"></p>
  <div class="card">
    <div class="toolbar"><div class="batch-retry-actions"><button id="btnBatchRecheck" hidden>重试系统异常</button><button id="btnStrictReview" hidden>复审旧版已通过</button></div><div style="display:flex;gap:10px"><input id="searchInput" class="search-input" placeholder="搜索SKU，多个用空格或逗号分隔"><select id="filterStatus" class="search-input" style="width:140px"><option value="all">全部商品</option><option value="work">待处理</option><option value="manual">待人工</option><option value="ready">可导出</option><option value="rejected">已淘汰</option><option value="error">系统异常</option></select></div></div>
    <div class="selection-strip"><span id="selectionInfo"></span><button class="linkbtn" id="selectAllFiltered" hidden>选择全部筛选结果</button><button class="linkbtn" id="clearSelection" hidden>取消选择</button></div>
    <div class="tablewrap"><table><thead><tr><th style="width:40px"><input type="checkbox" id="selectPage" aria-label="全选本页"></th><th>SKU</th><th>Amazon链接</th><th>状态</th><th>原因</th><th>操作</th></tr></thead><tbody id="itemRows"></tbody></table></div>
    <div class="subtoolbar" id="pagination"><button id="prevPage">上一页</button><span id="pageInfo"></span><button id="nextPage">下一页</button></div>
  </div>
</section>
</main>
<dialog id="importDialog"><div class="dialoghead"><h3>导入新批次</h3><button class="close" data-close aria-label="关闭">×</button></div><div class="dialogbody"><div class="form-group"><label>批次名称（选填）</label><input type="text" id="inputBatchName" placeholder="默认按日期命名"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><label>SKU列表</label><input type="file" id="goodsFile" accept=".xlsx,.xls,.csv"></div><textarea id="skuInput" rows="7" placeholder="粘贴SKU，支持空格、逗号或换行。文件仅A列，首行为列名。"></textarea></div><p id="importSummary" class="muted"></p><p id="importError" style="color:#a53d38"></p></div><div class="dialogfoot"><button data-close>取消</button><button id="btnConfirmImport" class="primary">确认并开始</button></div></dialog>
<dialog id="detailDialog"><div class="dialoghead"><div><div class="detail-id-line"><h3 id="dtTitle"></h3><span id="dtStatus" class="badge b-gray"></span></div><div id="detailMeta"></div></div><button class="close" data-close aria-label="关闭">×</button></div><div id="dtBody" class="dialogbody"></div><div id="dtFooter" class="dialogfoot"></div></dialog>
<dialog id="settingsDialog" style="width:420px"><div class="dialoghead"><h3>设置</h3><button class="close" data-close aria-label="关闭">×</button></div><div class="dialogbody"><h4>导出字段</h4><p class="muted">仅保存在当前浏览器。</p><label style="display:block;margin-bottom:12px"><input type="checkbox" checked disabled> SKU（必选）</label><label style="display:block;margin-bottom:12px"><input type="checkbox" id="expBrand" checked> 品牌</label><label style="display:block;margin-bottom:12px"><input type="checkbox" id="expLink" checked> 链接</label><label style="display:block;margin-bottom:12px"><input type="checkbox" id="expTitle" checked> 标题</label><label style="display:block;margin-bottom:12px"><input type="checkbox" id="expBullets" checked> 五点</label><label style="display:block;margin-bottom:12px"><input type="checkbox" id="expDesc" checked> 长描述</label><label style="display:block;margin-bottom:12px"><input type="checkbox" id="expPrice" checked> 当前金额（采集总价，缺失留空）</label><p id="settingsError" role="alert"></p><details><summary>使用说明</summary><p id="settingsInfo" class="muted"></p></details></div><div class="dialogfoot"><button id="settingsSave" class="primary">保存</button></div></dialog>
<dialog id="settingsConfirmDialog" aria-labelledby="settingsConfirmTitle" aria-describedby="settingsConfirmMessage"><div class="dialoghead"><h3 id="settingsConfirmTitle">保存更改？</h3></div><div class="dialogbody"><p id="settingsConfirmMessage">设置有未保存的更改，是否保存？</p><p id="settingsConfirmError" role="alert"></p></div><div class="dialogfoot"><button id="settingsContinue">继续编辑</button><button id="settingsDiscard">不保存退出</button><button id="settingsConfirmSave" class="primary" autofocus>保存并关闭</button></div></dialog>

    for(const match of sentence.matchAll(claim)){
      const before=sentence.slice(0,match.index).split(/但是|然而|不过|但/).at(-1).slice(-45);
      const after=sentence.slice(match.index+match[0].length,match.index+match[0].length+30);
      const negated=/(?:不能|无法|不足以|不代表|不等于|尚未|未能|未证明|未经证实|不得|不应|不保证|不能据此|没有证据).{0,24}$/.test(before)
        ||/^(?:的|这一|这个|说法|结论|所需|相关|\s){0,8}(?:证据不足|依据不足|尚未证实|无法确认|没有依据)/.test(after);

async function auditInputHash(fields,sku,revision,note=''){

function cleanText(value){
 return text(value).replace(/\[Image:\s*https?:\/\/[^\]\n]+\]/gi,'')
  .replace(/\b(?:Amazon['’]s Choice|Fulfilled by Amazon|Visit the [^\n]{1,70} Store|FREE (?:Amazon )?Prime (?:Shipping|Delivery)|Prime[- ]eligible)\b/gi,'')
  .replace(/https?:\/\/[^\s<>"\]]+/gi,'')
  .replace(/\b(?:available|purchased|sold|fulfilled)\s+(?:from|by|on|at)\s+(?:Etsy|Target|Costco|Best\s+Buy)\b/gi,'')
  .replace(/\b(?:Amazon(?:Basics|\s+Basics)?(?:['’]s)?|Prime|Walmart|AliExpress|Alibaba|Temu|Shopify)\b/gi,'')
  .replace(/(?:亚马逊|沃尔玛|速卖通|淘宝|京东|拼多多)/g,'')
  .replace(/[ \t]{2,}/g,' ').replace(/\n[ \t]+/g,'\n').replace(/\n{3,}/g,'\n\n').trim();
}

const COMPAT_BEFORE = /\b(?:for|with|compatible|replacement|replace|replaces|replaced|replacing|fit|fits|fitted|fitting|works?\s+with|work\s+with|designed\s+for|made\s+for|suitable\s+for|compatible\s+with|compatible\s+for|replacement\s+for|replaces?\s+for|fits?\s+for|fitment\s+for)\s*$/i;
const COMPAT_AFTER = /^\s*(?:compatible\b|replacement(?:\s+part)?\b|fit(?:ment)?\b|works?\s+with\b|fits?\s+for\b)/i;
const POSSESSIVE_AFTER = /^\s*['’]s\b/i;
function escapeRegExp(s){return String(s).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}
function stripBareBrand(value, brand){
  const src = text(value);
  const brandName = text(brand).trim();
  if(!src || !brandName) return src;
  const re = new RegExp('(^|[^A-Za-z0-9])(' + escapeRegExp(brandName) + ')(?=[^A-Za-z0-9]|$)', 'gi');
  return src.replace(re, function(match, before, hit, offset, whole){
    const afterIdx = offset + match.length;
    const contextBefore = whole.slice(Math.max(0, offset - 40), offset);
    const contextAfter = whole.slice(afterIdx, afterIdx + 40);
    if(COMPAT_BEFORE.test(contextBefore)) return match;
    if(COMPAT_AFTER.test(contextAfter)) return match;
    if(POSSESSIVE_AFTER.test(contextAfter)) return match;
    return before;
  });
}
function tidySpacing(value){
  return text(value)
    .replace(/[ \t]+([,.;:!?])/g,'$1')
    .replace(/[ \t]{2,}/g,' ')

}
function stripBrandLabelLines(value,brand=''){

  return text(value).replace(new RegExp('^[ \\t]*(?:brand|品牌)[ \\t]*[:：][ \\t]*'+knownBrand+'(?:\\r?\\n|$)','gim'),'');

function factTokens(s) {return [...text(s).replace(/https?:\/\/\S+/g,'').matchAll(/\d+(?:\.\d+)?\s*(?:mm|cm|kg|lbs?|oz|inches|inch|ml|volts?|watts?|pcs?|pieces|ft|"|%|°C)\b/gi)].map(x=>x[0].toLowerCase()).sort();}
function brandFactAmbiguous(brand,f={}){
  const b=text(brand).trim().toLowerCase(),raw=f._raw?.data||f._raw?.product||f._raw?.item||f._raw||{};
  let found=false;
  function inspect(value,path=''){
    if(value&&typeof value==='object'){for(const [key,v]of Object.entries(value))inspect(v,path+'.'+key);return;}
    if(/material|colou?r|finish|pattern|材质|材料|颜色|色彩|表面处理/i.test(path)&&substantive(value)&&text(value).toLowerCase().includes(b))found=true;
  }

function prepareCopy(f, brand) {
  if(/(?:compatible\s+(?:with|for)|\bfor|\bwith|replacement\s+for|\bfit(?:s)?)\s+(?:Amazon|Prime|Walmart|AliExpress|Temu)\b|\bAmazon\s+(?:Fire|Kindle|Echo)\b/i.test([f.title,f.bullets,f.description].map(text).join('\n')))throw new Error('兼容信息涉及来源平台品牌，不能靠删词改变事实，请人工处理');
  if(brandFactAmbiguous(brand,f)&&[f.title,f.bullets,f.description].some(v=>stripBareBrand(text(v),brand)!==text(v)))throw new Error('品牌词与材质、颜色或功能词重名，自动删词可能改变商品事实，请人工确认或排除');
  const clean = v => tidySpacing(stripBrandLabelLines(stripBareBrand(cleanText(v), brand),brand));
  const copy={title:clean(f.title),bullets:clean(f.bullets),description:clean(f.description)};
  if(!copy.title)throw new Error('清理后标题为空，需要人工确认');
  if(JSON.stringify(factTokens([f.title,f.bullets,f.description].join('\n')))!==JSON.stringify(factTokens(Object.values(copy).join('\n'))))throw new Error('清理可能删除规格数据，已阻止导出');
  if(/\b(?:Amazon['’]s Choice|Fulfilled by Amazon|FREE Prime Shipping)\b/i.test(Object.values(copy).join('\n')))throw new Error('仍有来源促销内容，需核验');

async function copyItem(b,i) {

function prepareQueueEntry(i,entry){

  if(entry.action==='collect_sync'){i.reason='正在查询原采集任务';return;}

async function runWorkQueue(b,{singleItem,recheckVerification,recheckSystemError,recheckProhibition}){

    const remaining=q.entries.slice(q.cursor).filter(entry=>!entry.completedAt);
    const hasOtherWork=remaining.some(entry=>{
      const item=b.items.find(i=>i.itemId===entry.itemId);
      return item&&(item.dataRevision||0)===entry.revision&&!systemIssue(item);
    });
    if(!hasOtherWork){
      (b.workQueueHistory??=[]).push({...q,state:'superseded',supersededAt:now(),
        note:'旧队列已结束或未能处理当前异常；保留记录，按商品当前状态建立恢复队列'});
      q=null;
    }else{
      if(b.suspendedQueue)throw new Error('还有尚未完成的暂停队列，请先完成当前队列再重试系统异常');

    }
  }
  const unfinished=q&&q.state!=='completed';
  if(recheckProhibition&&unfinished&&q.kind!=='strict')throw new Error('请先继续完成当前队列，再复审旧版已通过商品；不会覆盖原队列');

  if(singleItem&&unfinished){
    if(q.kind==='single'&&q.entries[0].itemId!==singleItem.itemId)throw new Error('还有单个商品任务未结束，请先接续原任务');
    if(q.kind!=='single')b.suspendedQueue=q;
  }
    if(singleItem||(!unfinished&&(recheckVerification||recheckSystemError||recheckProhibition))){
        const items=singleItem?b.items.filter(i=>i.itemId===singleItem.itemId):b.items.filter(recheckProhibition?pendingProhibitionRefresh
          :recheckSystemError?i=>{const action=recoveryAction(i,b);return !!action&&action!=='blocked';}:canRecheckVerification);
    if(!items.length){toast('当前没有可安全自动恢复的商品，请查看各 SKU 的具体原因');return;}
    q={id:uid(),kind:singleItem?'single':recheckProhibition?'strict':'verification',retrySystemErrors:!!recheckSystemError,
      state:'running',cursor:0,createdAt:now(),
      entries:items.map(i=>({itemId:i.itemId,revision:i.dataRevision||0,
        action:singleItem?.action||(recheckSystemError?recoveryAction(i,b)

    b.workQueue=q;

  beginRun(b);q.state='running';q.note='';render();
  try{
    await saveData(b);
    while(q.cursor<q.entries.length&&b.runStatus==='running'&&!app.stopping){
      const entry=q.entries[q.cursor],i=b.items.find(item=>item.itemId===entry.itemId);
      if(entry.completedAt){q.cursor++;await saveData(b);continue;}
      if(!i||(i.dataRevision||0)!==entry.revision){
        entry.outcome='资料已变化，已跳过';q.cursor++;await saveData(b);continue;
      }
      if(!entry.prepared){

        await saveData(b);
      }
      if(entry.action==='blocked'){entry.outcome='原审核任务资料无法对应，须核对资料后手动决定是否重新审核';entry.completedAt=now();q.cursor++;await saveData(b);continue;}
      if(entry.action==='collect_sync'){
        if(b.collection?.remoteId)await pollCollection(b,new Set([i.itemId]),b.collection,true);
        else {i.collectStatus='sync_error';i.reason='缺少原采集任务编号，无法查询结果';await saveData(b);}
      }
      if(entry.action==='recollect'){
        if(i.collectStatus==='pending')await submitCollection(b,[i],entry);
        if(entry.collection?.state==='sync_error')entry.collection.state='polling';
        while(i.collectStatus==='collecting'&&b.runStatus==='running'&&!app.stopping){
          await pollCollection(b,new Set([i.itemId]),entry.collection);

          if(i.collectStatus==='collecting')await sleep(2500);

          await saveData(b);break;

  }finally{app.processing=false;app.activeId=null;render();}

async function runLoop(bid,{recheckVerification=false,recheckSystemError=false,resyncCollection=false,recheckProhibition=false,singleItem=null}={}) {

function auditNextStep(issue){

    missing_fact_evidence:'系统补齐判断所依据的商品原文；已有具体可核实问题时交人工处理。',
    hazard_relation_conflict:'系统先核对实际出售的商品与收纳、兼容对象的关系，再补审内容物判断。',
    unsupported_safety_assertion:'系统核对安全表述及原文依据，区分宣传、否定说明和实际安全结论。',
    invalid_policy_reference:'系统重新核对适用政策与具体条款，不凭错误引用作决定。'};
  if(steps[issue.failureKind])return steps[issue.failureKind];

  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'商品结果');XLSX.writeFile(wb,name.replace(/[\\/:*?"<>|]/g,'_')+'.xlsx');
}

function parseImportRows(rows) {
  if(rows.some(row=>row.slice(1).some(v=>text(v).trim()!=='')))throw new Error('文件仅允许A列SKU，B列及以后有内容，整份文件未导入');
  if(!text(rows[0]?.[0]).trim()||asin(rows[0]?.[0]))throw new Error('A1必须为列标题，SKU从A2开始；未忽略第一条商品');
  const values=rows.slice(1).map(r=>text(r[0]).trim()).filter(Boolean),bad=values.filter(v=>!asin(v));
  if(bad.length)throw new Error(`存在无效SKU：${bad.slice(0,3).join('、')}`);return values.map(asin);
}
function importSummary(){
  const values=$('skuInput').value.split(/[\s,;，；]+/).filter(Boolean);
  const invalid=values.filter(v=>!asin(v)),valid=[...values.map(asin).filter(Boolean),...app.fileAsins];
  const unique=new Set(valid),seen=new Set(),duplicates=new Set();
  for(const id of valid){if(seen.has(id))duplicates.add(id);seen.add(id);}
  const existing=new Set(app.batches.flatMap(b=>b.items.map(i=>i.asin)));
  const historical=[...unique].filter(id=>existing.has(id));
  const sample=list=>list.slice(0,20).join('、')+(list.length>20?'等 '+list.length+' 条':'');
  $('importSummary').textContent=`粘贴 ${values.length} 条，文件 ${app.fileAsins.length} 条；合并去重后格式有效SKU ${unique.size} 条（未验证商品是否存在）。`
    +(duplicates.size?' 重复项已合并：'+sample([...duplicates])+'。':'')
    +(invalid.length?' 无效内容：'+sample(invalid)+'；必须修正后才能提交。':'')
    +(historical.length?' 已有批次中出现：'+sample(historical)+'；再次提交将创建新批次，不会复用旧审核结论。':'')
    +(app.fileError||'');
}

async function submitBatchAdmin(){
  if(batchAdmin.busy)return;
  const password=$('batchAdminPassword').value;if(!password){$('batchAdminError').textContent='请输入管理员密码';return;}
  batchAdmin.busy=true;app.adminBusy=true;$('batchAdminConfirm').disabled=true;$('batchAdminError').textContent='';
  const action=batchAdmin.action,ids=[...batchAdmin.ids],operationId=batchAdmin.operationId;
  try{
    await app.writeTail.catch(()=>{});
    if(app.stopping)throw new Error('上次保存尚未确认，请刷新后再管理批次');
    const execute=async()=>{
      if(action!=='list'){const wait=1100-(Date.now()-(app.lastWrite||0));if(wait>0)await sleep(wait);}
      const path=action==='list'?'/api/admin/trash/list':'/api/admin/batches/'+(action==='delete'?'delete':'restore');
      const response=await api(path,{method:'POST',body:{password,ids,operationId,version:app.serverVersion},timeout:60000});
      if(!response.success)throw new Error(response.detail||'管理员操作未完成');
      if(action==='list'){
        batchAdmin.trashEntries=response.entries||[];batchAdmin.trashSelected.clear();
        $('batchTrashNotice').textContent=response.unavailable?`有 ${response.unavailable} 条记录暂时未能读取，请稍后刷新。`:'删除后7天到期，恢复操作不会启动任务。';
        $('batchAdminDialog').close();renderBatchTrash();if(!$('batchTrashDialog').open)$('batchTrashDialog').showModal();
      }else{
        app.lastWrite=Date.now();
        applyAdminData(response.data);$('batchAdminDialog').close();
        if(action==='restore'){batchAdmin.trashEntries=batchAdmin.trashEntries.filter(e=>!ids.includes(e.id));batchAdmin.trashSelected.clear();renderBatchTrash();}
        toast(response.replayed?'本次操作此前已完成，已读取当前状态':action==='delete'?`已删除 ${response.count} 个批次，7天内可恢复`:`已恢复 ${response.count} 个批次，保持暂停`);
      }
    };
    if(action==='list')await execute();else{
      if(!navigator.locks)throw new Error('请使用支持处理窗口保护的新版Chrome');
      await navigator.locks.request('ebay-workbench-processing-v1',{ifAvailable:true},async lock=>{if(!lock)throw new Error('另一页面正在处理，请先暂停后再管理批次');await execute();});
    }
  }catch(e){
    const message=e.status===409?'云端状态已变化或记录尚未同步，请关闭弹窗并刷新后重试。':e.message;
    $('batchAdminError').textContent=message;
    if(!e.status||e.status>=500)$('batchAdminError').textContent+=' 如果响应中断，请先刷新核对；再次确认会沿用本次操作编号。';
  }finally{
    $('batchAdminPassword').value='';batchAdmin.busy=false;app.adminBusy=false;$('batchAdminConfirm').disabled=false;
    if(app.view==='home')renderHome();
  }
}

async function recoverInterruptedSave(){
  const resume=app.resumeAfterSave;
  if(!resume||navigator.onLine===false||app.recoveringSave||app.processing||app.starting
    ||app.saving||app.detailBusy||app.adminBusy||app.fetching||detailDirty||document.querySelector('dialog[open]'))return;
  if((app.nextRecoveryAt||0)>Date.now())return;
  app.recoveringSave=true;
  try{
    const pending=app.pendingSave;
    await fetchData({automatic:true});
    if(app.stopping||app.pendingSave)return;
    app.resumeAfterSave=null;app.nextRecoveryAt=0;app.recoveryFailures=0;
    if(pending){
      // A lost save response pauses the local runner after taking its snapshot.
      // Ignore only that known transient pause; all product/task fields must still match.
      const batches=app.batches.map(b=>{
        if(b.id!==resume.batchId||b.runStatus!=='paused')return b;
        const expected=pending.patch?.batchId===b.id?pending.patch.fields
          :pending.batch?.id===b.id?pending.batch:pending.batches?.find(x=>x.id===b.id);
        return expected?.runStatus==='running'?{...b,runStatus:'running'}:b;
      });
      if(!savedPayloadMatches({version:app.serverVersion,batches},pending))return;
    }
    const b=batch(resume.batchId);
    if(!b)return;
    if(!resume.wasRunning||(b.intentRevision||0)!==resume.intentRevision||['user','ai_incomplete'].includes(b.pauseKind))return;
    if(resume.queueId&&(b.workQueue?.id!==resume.queueId||b.workQueue.state==='completed'||b.workQueue.note))return;
    if(['running','paused'].includes(b.runStatus))await startBatch(b.id);
  }catch(error){
    if(error.status&&error.status<500){app.resumeAfterSave=null;toast(error.message);}
    else{app.recoveryFailures=(app.recoveryFailures||0)+1;app.nextRecoveryAt=Date.now()+Math.min(60000,5000*2**Math.min(app.recoveryFailures,4));if(app.recoveryFailures===3)toast('保存结果暂时无法确认，系统会继续自动核对：'+error.message);}
  }
  finally{app.recoveringSave=false;}
}

    if(a==='image-prev'||a==='image-next'){imagePreviewState.index=Math.max(0,Math.min(imagePreviewState.links.length-1,imagePreviewState.index+(a==='image-prev'?-1:1)));showPreviewImage();return;}
    if(a==='expand-text'){app.detailExpanded??={};app.detailExpanded[el.dataset.key]=!app.detailExpanded[el.dataset.key];const i=itemOf(app.currentBatchId,app.detailItemId);if(i)renderDetailSource(i);return;}
    if(a==='enter')enterBatch(el.dataset.bid);else if(a==='detail'){try{if(!openDetail(el.dataset.iid))toast('未找到该商品，请刷新批次');}catch(error){toast('详情打开失败：'+error.message);}}
    else if(a==='export'){try{doExport(el.dataset.bid);}catch(e){toast(e.message);}}
    else fail(detailAction(a));
  });
  $('imagePreviewDialog').addEventListener('close',()=>{$('previewImage').removeAttribute('src');$('previewImage').hidden=true;});
  for(const id of ['batchAdminDialog','batchTrashDialog'])$(id).addEventListener('cancel',e=>{e.preventDefault();closeDialog($(id));});
  $('detailDialog').addEventListener('cancel',e=>{e.preventDefault();closeDialog($('detailDialog'));});
  $('detailConfirmDialog').addEventListener('cancel',e=>{e.preventDefault();if(!app.detailBusy)$('detailConfirmDialog').close();});
  $('settingsDialog').addEventListener('cancel',e=>{e.preventDefault();closeDialog($('settingsDialog'));});
  $('settingsConfirmDialog').addEventListener('cancel',e=>{e.preventDefault();$('settingsConfirmDialog').close();});
  // Install recovery before the first awaited read: a failed boot must remain recoverable.
  installConnectionRecovery();
  render();
  await loadWorkbench();
}
async function checkBackend(){
  if(app.backendCompatible)return true;
  try{const info=await api('/api/workbench_info',{timeout:10000});if(info.build!==BUILD||info.audit_contract!==2||info.audit_protocol!==3||info.audit_completion_contract!==2||!(info.audit_model_protocol>=13)||info.prohibition_review_version!==PROHIBITION_REVIEW_VERSION||info.data_contract!==2||info.seller_policy_version!==SELLER_POLICY_VERSION)throw new Error('版本不对应');app.backendCompatible=true;return true;}
  catch(error){toast(error.code==='request_timeout'||error.code==='connection_lost'
    ?'暂时无法连接审核后台，请稍后重试。':'审核后台版本未配套，请同时部署本次 worker.js 和 index.html。旧数据仍保留，需按新标准审核后导出。');return false;}
}
if(!window.__AUDIT_TEST__)fail(init());
</script>
