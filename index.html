<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>商品审核工作台</title>
<style>
:root{font-family:Inter,"Microsoft YaHei",system-ui,sans-serif;color:#23332f;background:#f5f7f6;font-size:14px;--green:#216b52;--line:#e2e8e4;--muted:#748079;--bg:#f9fbf9;}
*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:8px;padding:10px 15px;background:white;color:inherit;transition:all .2s}button:hover{background:#f1f6f3}button:disabled{cursor:not-allowed;opacity:.5}.primary{background:var(--green);border-color:var(--green);color:white}.primary:hover{background:#17583f}.danger{color:#a53d38;border-color:#fceceb}.danger:hover{background:#fceceb}.linkbtn{border:0;background:transparent;color:var(--green);padding:0;font-size:13px}.linkbtn:hover{text-decoration:underline;background:transparent}
header{height:82px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(24px,calc((100vw - 1260px)/2))}
.brand{display:flex;align-items:center;gap:12px}.logo{background:var(--green);color:white;border-radius:10px;padding:10px;font-weight:800;font-size:18px}h1{font-size:19px;margin:0 0 4px}h2{font-size:20px;margin:0 0 12px;display:flex;align-items:center;gap:12px}
main{max-width:1260px;padding:30px 24px 64px;margin:auto}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.card{background:white;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:20px}
.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;text-align:left;white-space:normal}th{background:#f7f9f7;color:#75817b;font-weight:500;font-size:12px}th,td{padding:14px 16px;border-bottom:1px solid #edf0ed;vertical-align:middle}td{font-size:13px}
.title-col{max-width:320px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-overflow:ellipsis}
.badge{display:inline-block;white-space:nowrap;padding:3px 8px;border-radius:4px;font-size:12px;border:1px solid transparent}
.b-pass{background:#e7f4ec;color:#28714a;border-color:#c3e6d3}.b-warn{background:#fff3dd;color:#966314;border-color:#f2d8a6}.b-err{background:#fceceb;color:#a34f48;border-color:#f2cac7}.b-run{background:#e9f0fb;color:#4265a0;border-color:#c3d4f2}.b-gray{background:#f0f2f0;color:#748079;border-color:#e2e5e2}
.toolbar{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#f9fbf9;border-bottom:1px solid var(--line);flex-wrap:wrap;gap:10px}
.batch-bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.search-input{width:220px;padding:8px 12px;border:1px solid var(--line);border-radius:6px}
dialog{border:1px solid var(--line);border-radius:14px;padding:0;max-width:calc(100vw - 28px);max-height:90vh;box-shadow:0 20px 80px #193d2526;width:1000px;margin:auto}
dialog::backdrop{background:#1c332c66}.dialoghead{padding:16px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:white;z-index:2}.dialoghead h3{font-size:17px;margin:0}.close{border:0;padding:4px 9px;font-size:22px}
.dialogbody{padding:24px}.dialogfoot{display:flex;justify-content:flex-end;gap:10px;padding:16px 24px;border-top:1px solid var(--line);background:#fafbf9;position:sticky;bottom:0}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.field{margin-bottom:16px}.field .label{color:var(--muted);font-size:12px;margin-bottom:6px}.text{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6;font-size:13px;max-height:300px;overflow-y:auto;background:#f7f9f6;padding:10px;border-radius:6px;border:1px solid #eef1ee}
.section-box{border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:20px;background:white}.section-box h4{margin:0 0 12px;font-size:14px;color:#334239;border-left:3px solid var(--green);padding-left:8px}
.form-group label{display:block;margin-bottom:6px;font-size:13px;font-weight:500}.form-group textarea,.form-group select,.form-group input[type=text]{width:100%;border:1px solid var(--line);border-radius:6px;padding:10px;margin-bottom:12px;resize:vertical}
.hidden{display:none!important}
#toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);padding:12px 20px;background:#243b30;color:white;border-radius:6px;z-index:100;display:none;box-shadow:0 5px 20px rgba(0,0,0,0.2)}
.checkbox-cell{width:40px;text-align:center}
</style>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" defer></script>
</head>
<body>
<header>
  <div class="brand"><div class="logo">✓</div><div><h1>商品审核工作台</h1><small>批次管理 · 风险审核 · 导出</small></div></div>
  <button id="btnSettings">设置</button>
</header>
<main>
  <!-- 视图1：批次首页 -->
  <div id="homeView">
    <div class="actions" style="justify-content:space-between;margin-bottom:20px">
      <h2>批次列表</h2>
      <button id="importBtn" class="primary">＋ 导入新批次</button>
    </div>
    <div class="card">
      <div class="tablewrap">
        <table>
          <thead><tr><th>批次名称 / 导入时间</th><th>商品数量</th><th>批次状态</th><th>待核验</th><th>失败</th><th>可导出</th><th>操作</th></tr></thead>
          <tbody id="batchRows"><tr><td colspan="7" style="text-align:center;padding:20px">加载数据中...</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- 视图2：SKU 明细 -->
  <div id="itemsView" class="hidden">
    <div class="actions" style="margin-bottom:20px">
      <button id="backHomeBtn">← 返回批次列表</button>
      <h2 id="currentBatchName" style="margin:0"></h2>
    </div>
    
    <div class="card">
      <div class="toolbar">
        <div class="batch-bar">
          <button id="btnBatchCollect">批量采集</button>
          <button id="btnBatchRetry">重试失败项</button>
          <button id="btnBatchExclude" class="danger">批量排除</button>
        </div>
        <div style="display:flex;gap:10px">
          <input type="text" id="searchInput" class="search-input" placeholder="搜索 SKU 或标题">
          <select id="filterStatus" class="search-input" style="width:130px">
            <option value="all">全部状态</option>
            <option value="collect_pending">待采集</option>
            <option value="collect_error">采集失败</option>
            <option value="review_pending">待审核</option>
            <option value="review_verify">待核验</option>
            <option value="review_passed">已通过</option>
            <option value="review_excluded">已排除</option>
            <option value="copy_verify">文案待核验</option>
          </select>
        </div>
      </div>
      
      <!-- 选中操作栏 -->
      <div id="selectionBar" class="toolbar hidden" style="background:#eaf2ed;border-bottom:1px solid #c3e6d3">
        <div>已选择 <strong id="selCount">0</strong> 个商品</div>
        <div style="display:flex;gap:10px">
          <button id="btnSelExclude" class="danger">排除所选</button>
          <button id="btnSelPass">批量通过</button>
          <button id="btnSelCancel">取消选择</button>
        </div>
      </div>

      <div class="tablewrap">
        <table>
          <thead>
            <tr>
              <th class="checkbox-cell"><input type="checkbox" id="selectAll"></th>
              <th>SKU</th><th>商品标题</th><th>采集状态</th><th>审核 / 文案状态</th><th>原因 / 待办</th><th>操作</th>
            </tr>
          </thead>
          <tbody id="itemRows"></tbody>
        </table>
      </div>
      <div style="padding:12px 16px;text-align:center;border-top:1px solid var(--line);background:#f9fbf9">
        <button id="btnSelectAllFiltered" class="linkbtn">选中全部筛选结果</button>
      </div>
    </div>
  </div>
</main>

<!-- 导入弹窗 (统一窗口) -->
<dialog id="importDialog">
  <div class="dialoghead"><h3>导入新批次</h3><button class="close" data-close>×</button></div>
  <div class="dialogbody">
    <div style="margin-bottom:15px">
      <label>批次名称（可选）</label>
      <input type="text" id="inputBatchName" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:6px" placeholder="不填则自动按日期生成">
    </div>
    
    <div style="margin-bottom:10px;font-weight:500">SKU 列表</div>
    <textarea id="skuInput" style="width:100%;height:150px;border:1px solid var(--line);border-radius:6px;padding:10px;font-family:monospace;margin-bottom:15px" placeholder="每行一个亚马逊 ASIN..."></textarea>
    
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:15px">
      <span style="color:var(--muted)">或</span>
      <input type="file" id="goodsFile" accept=".xlsx,.xls,.csv" style="font-size:13px">
    </div>
    
    <div id="importSummary" style="background:#f0f4f1;padding:10px;border-radius:6px;font-size:13px;margin-bottom:15px">
      待导入数量：0 个
    </div>
    <div id="importError" style="color:#a53d38;font-size:13px;margin-top:10px"></div>
  </div>
  <div class="dialogfoot"><button data-close>取消</button><button id="btnConfirmImport" class="primary">确认导入</button></div>
</dialog>

<!-- 商品详情弹窗 -->
<dialog id="detailDialog">
  <div class="dialoghead">
    <div><h3 id="dtTitle" style="margin-bottom:4px">商品详情</h3><span id="dtStatus" class="badge b-gray"></span></div>
    <button class="close" data-close>×</button>
  </div>
  <div id="dtBody" class="dialogbody"></div>
  <div class="dialogfoot" id="dtFooter"></div>
</dialog>

<!-- 设置弹窗 -->
<dialog id="settingsDialog" style="width:400px">
  <div class="dialoghead"><h3>设置</h3><button class="close" data-close>×</button></div>
  <div class="dialogbody">
    <div class="section-box">
      <h4>导出字段设置</h4>
      <p class="muted" style="font-size:12px;margin-bottom:12px">此设置仅保存在本浏览器，不影响其他人。</p>
      <label style="display:block;margin-bottom:8px"><input type="checkbox" checked disabled> SKU（必选）</label>
      <label style="display:block;margin-bottom:8px"><input type="checkbox" id="expLink" checked> 亚马逊链接</label>
      <label style="display:block;margin-bottom:8px"><input type="checkbox" id="expTitle" checked> 清理后的标题</label>
      <label style="display:block;margin-bottom:8px"><input type="checkbox" id="expBullets" checked> 清理后的五点描述</label>
      <label style="display:block;margin-bottom:8px"><input type="checkbox" id="expDesc" checked> 清理后的长描述</label>
    </div>
  </div>
  <div class="dialogfoot"><button class="primary" data-close>保存</button></div>
</dialog>

<!-- 批量排除原因弹窗 -->
<dialog id="excludeDialog">
  <div class="dialoghead"><h3>批量排除所选商品</h3><button class="close" data-close>×</button></div>
  <div class="dialogbody">
    <div class="form-group">
      <label>排除原因（必填）</label>
      <textarea id="excludeReason" rows="3"></textarea>
    </div>
  </div>
  <div class="dialogfoot"><button data-close>取消</button><button id="btnConfirmExclude" class="primary danger">确认排除</button></div>
</dialog>

<div id="toast"></div>

<script>
'use strict';
const WORKER_URL = 'https://scraper-proxy.1172743763.workers.dev';
const TOKEN = 'ebay1031'; // 请替换为真实密码

// ========== 状态管理 ==========
let app = {
  serverVersion: 0,
  batches: [],
  currentBatchId: null,
  view: 'home',
  searchQuery: '',
  filterStatus: 'all',
  selectedItemIds: new Set(),
  detailItemId: null
};

let exportPrefs = {
  link: true, title: true, bullets: true, desc: true
};

// ========== 工具函数 ==========
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const text = v => Array.isArray(v) ? v.map(text).join('\n') : (v && typeof v === 'object' ? JSON.stringify(v, null, 2) : String(v ?? ''));
const meaningful = v => !['', 'n/a', 'na', 'null', 'none', '未提供'].includes(text(v).trim().toLowerCase());
function asin(v) { const s = text(v).trim().toUpperCase(); return /^[A-Z0-9]{10}$/.test(s) ? s : null; }

function toast(msg) {
  const el = $('toast'); el.textContent = msg; el.style.display = 'block';
  clearTimeout(el.timer); el.timer = setTimeout(() => el.style.display = 'none', 4000);
}

// 自适应解析采集系统返回的字段
function normalizeCollectedData(raw) {
  return {
    title: raw.title || raw['商品标题'] || raw['标题'] || '',
    brand: raw.brand || raw['品牌'] || '',
    bullets: raw.bullets || raw['五点描述'] || raw['卖点'] || raw.bullet_points || '',
    description: raw.description || raw['长描述'] || raw['商品描述'] || '',
    images: raw.images || raw['商品图片'] || raw['图片链接'] || raw.imageurls || '',
    category: raw.category || raw['商品类型'] || raw['类目路径'] || '',
    model: raw.model || raw['产品型号'] || '',
    variants: raw.variants || raw['变体属性'] || '',
    condition: raw.condition || raw['品相'] || raw['成色'] || '',
    stockStatus: raw.stockStatus || raw['库存状态'] || '',
    _raw: raw
  };
}

// ========== 网络请求：读写数据 ==========
async function fetchData() {
  try {
    const res = await fetch(`${WORKER_URL}/api/data`, { headers: { 'X-Workbench-Token': TOKEN } });
    if (!res.ok) throw new Error('获取数据失败: ' + res.status);
    const data = await res.json();
    app.serverVersion = data.version || 0;
    app.batches = data.batches || [];
    render();
  } catch (e) {
    toast(e.message);
  }
}

async function saveData() {
  try {
    const payload = { version: app.serverVersion, batches: app.batches };
    const res = await fetch(`${WORKER_URL}/api/data`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Workbench-Token': TOKEN },
      body: JSON.stringify(payload)
    });
    
    if (res.status === 409) {
      if (confirm("保存冲突：有其他人刚刚修改了数据，你的修改可能会覆盖别人的内容。\n\n点击“确定”强制覆盖，或点击“取消”拉取最新数据。")) {
        // 强制覆盖：把版本号设为0，或者获取最新版本号再提交
        const latest = await fetch(`${WORKER_URL}/api/data`, { headers: { 'X-Workbench-Token': TOKEN } }).then(r=>r.json());
        app.serverVersion = latest.version;
        return saveData();
      } else {
        fetchData();
        return false;
      }
    }
    
    if (!res.ok) throw new Error('保存失败: ' + res.status);
    const result = await res.json();
    app.serverVersion = result.version;
    return true;
  } catch (e) {
    toast(e.message);
    return false;
  }
}

// ========== 初始化与渲染 ==========
function init() {
  // 加载本地导出偏好
  const prefsStr = localStorage.getItem('ebay_export_prefs');
  if (prefsStr) {
    try { exportPrefs = JSON.parse(prefsStr); } catch (e) {}
  }
  $('expLink').checked = exportPrefs.link;
  $('expTitle').checked = exportPrefs.title;
  $('expBullets').checked = exportPrefs.bullets;
  $('expDesc').checked = exportPrefs.desc;

  fetchData();
}

function renderHome() {
  $('homeView').classList.remove('hidden');
  $('itemsView').classList.add('hidden');
  
  const sorted = [...app.batches].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
  
  $('batchRows').innerHTML = sorted.map(b => {
    const total = b.items.length;
    let verify = 0, failed = 0, exportable = 0, running = false, completed = 0;
    
    b.items.forEach(i => {
      if (['collecting', 'auditing', 'cleaning'].includes(i.collectStatus) || ['auditing', 'cleaning'].includes(i.reviewStatus) || i.copyStatus === 'cleaning') running = true;
      if (i.reviewStatus === 'verify' || i.copyStatus === 'verify') verify++;
      if (i.collectStatus === 'error' || i.reviewStatus === 'error' || i.copyStatus === 'error') failed++;
      if (i.reviewStatus === 'passed' && i.copyStatus === 'completed') exportable++;
      if (i.reviewStatus === 'passed' || i.reviewStatus === 'excluded' || i.collectStatus === 'error') completed++;
    });

    let bStatus = '未开始'; let bCls = 'b-gray';
    if (running) { bStatus = '处理中'; bCls = 'b-run'; }
    else if (verify > 0 || failed > 0 || (completed < total)) { bStatus = '待处理'; bCls = 'b-warn'; }
    else if (total > 0) { bStatus = '已完成'; bCls = 'b-pass'; }
    
    return `<tr>
      <td><strong>${esc(b.name)}</strong><br><small style="color:var(--muted)">${new Date(b.createdAt).toLocaleString()}</small></td>
      <td>${total}</td>
      <td><span class="badge ${bCls}">${bStatus}</span></td>
      <td>${verify > 0 ? `<span style="color:#966314">${verify}</span>` : '-'}</td>
      <td>${failed > 0 ? `<span style="color:#a34f48">${failed}</span>` : '-'}</td>
      <td>${exportable > 0 ? `<strong>${exportable}</strong>` : '-'}</td>
      <td>
        <button class="linkbtn" onclick="enterBatch('${b.id}')">进入批次</button>
        <span style="color:var(--line);margin:0 6px">|</span>
        <button class="linkbtn" onclick="exportBatch('${b.id}', 'passed')" ${exportable === 0 ? 'disabled style="opacity:.3"' : ''}>导出通过(${exportable})</button>
      </td>
    </tr>`;
  }).join('');
}

function renderItems() {
  const batch = app.batches.find(b => b.id === app.currentBatchId);
  if (!batch) return goHome();

  $('homeView').classList.add('hidden');
  $('itemsView').classList.remove('hidden');
  $('currentBatchName').textContent = batch.name;

  const filtered = batch.items.filter(i => {
    const fTitle = (i.collected?.title || i.source?.title || '').toLowerCase();
    const matchSearch = !app.searchQuery || i.asin.includes(app.searchQuery.toUpperCase()) || fTitle.includes(app.searchQuery.toLowerCase());
    let matchStatus = true;
    if (app.filterStatus === 'collect_pending') matchStatus = i.collectStatus === 'pending';
    else if (app.filterStatus === 'collect_error') matchStatus = i.collectStatus === 'error';
    else if (app.filterStatus === 'review_pending') matchStatus = i.reviewStatus === 'pending';
    else if (app.filterStatus === 'review_verify') matchStatus = i.reviewStatus === 'verify';
    else if (app.filterStatus === 'review_passed') matchStatus = i.reviewStatus === 'passed';
    else if (app.filterStatus === 'review_excluded') matchStatus = i.reviewStatus === 'excluded';
    else if (app.filterStatus === 'copy_verify') matchStatus = i.copyStatus === 'verify';
    return matchSearch && matchStatus;
  });

  const validSelected = new Set();
  filtered.forEach(i => { if (app.selectedItemIds.has(i.itemId)) validSelected.add(i.itemId); });
  app.selectedItemIds = validSelected;
  
  $('selCount').textContent = app.selectedItemIds.size;
  $('selectionBar').classList.toggle('hidden', app.selectedItemIds.size === 0);
  $('selectAll').checked = filtered.length > 0 && filtered.every(i => app.selectedItemIds.has(i.itemId));

  $('itemRows').innerHTML = filtered.map(i => {
    const isSelected = app.selectedItemIds.has(i.itemId);
    const title = i.collected?.title || i.source?.title || '尚未采集标题';
    
    let cTag = `<span class="badge b-gray">待采集</span>`;
    if (i.collectStatus === 'collecting') cTag = `<span class="badge b-run">采集中</span>`;
    if (i.collectStatus === 'collected') cTag = `<span class="badge b-pass">已采集</span>`;
    if (i.collectStatus === 'error') cTag = `<span class="badge b-err">采集失败</span>`;

    let rTag = `<span class="badge b-gray">-</span>`;
    if (i.reviewStatus === 'pending') rTag = `<span class="badge b-gray">待审核</span>`;
    if (i.reviewStatus === 'verify') rTag = `<span class="badge b-warn">待核验</span>`;
    if (i.reviewStatus === 'passed') rTag = `<span class="badge b-pass">已通过</span>`;
    if (i.reviewStatus === 'excluded') rTag = `<span class="badge b-err" style="background:#f0f2f0;color:#748079;border-color:#e2e5e2">已排除</span>`;
    
    if (i.reviewStatus === 'passed') {
      if (i.copyStatus === 'pending') rTag += ` <span class="badge b-gray">文案待处理</span>`;
      if (i.copyStatus === 'cleaning') rTag += ` <span class="badge b-run">文案处理中</span>`;
      if (i.copyStatus === 'completed') rTag += ` <span class="badge b-pass">可导出</span>`;
      if (i.copyStatus === 'verify') rTag += ` <span class="badge b-warn">文案待核验</span>`;
      if (i.copyStatus === 'error') rTag += ` <span class="badge b-err">文案失败</span>`;
    }

    return `<tr>
      <td class="checkbox-cell"><input type="checkbox" class="item-check" data-id="${i.itemId}" ${isSelected ? 'checked' : ''}></td>
      <td style="font-family:monospace">${i.asin}</td>
      <td><div class="title-col" title="${esc(title)}">${esc(title)}</div></td>
      <td>${cTag}</td>
      <td>${rTag}</td>
      <td style="color:var(--muted);font-size:12px;max-width:200px">${esc(i.reason || '-')}</td>
      <td><button class="linkbtn" onclick="openDetail('${i.itemId}')">查看详情</button></td>
    </tr>`;
  }).join('');

  if (filtered.length === 0) {
    $('itemRows').innerHTML = '<tr><td colspan="7" style="text-align:center;padding:40px;color:var(--muted)">没有符合条件的商品。</td></tr>';
  }
}

function render() {
  if (app.view === 'home') renderHome();
  else renderItems();
}

function enterBatch(id) {

// ========== 动作：导入 ==========
let pendingFileAsins = [];

$('importBtn').onclick = () => {
  $('inputBatchName').value = '';
  $('skuInput').value = '';
  $('goodsFile').value = '';
  $('importError').textContent = '';
  pendingFileAsins = [];
  updateImportSummary();
  $('importDialog').showModal();
};

function updateImportSummary() {
  const textAsins = $('skuInput').value.split(/[\s,;，；]+/).map(v => asin(v)).filter(Boolean);
  const uniqueAsins = new Set([...textAsins, ...pendingFileAsins]);
  $('importSummary').innerHTML = `待导入数量：<strong style="color:var(--green);font-size:16px">${uniqueAsins.size}</strong> 个（同批次自动去重）`;
}
$('skuInput').oninput = updateImportSummary;

$('goodsFile').onchange = async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  $('importError').textContent = '读取中...';
  try {
    const b = await file.arrayBuffer();
    const wb = XLSX.read(b, {type:'array'});
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet, {header:1, defval:''});
    
    if (rows.length < 2) throw new Error('表格无有效数据。');
    
    // 严格校验 B 列及以后不能有数据
    for (let i = 1; i < rows.length; i++) {
      const row = rows[i];
      // 检查 B 列(索引1)及之后是否有非空值
      const hasExtraData = row.slice(1).some(cell => String(cell).trim() !== '');
      if (hasExtraData) {
        throw new Error(`仅支持 A 列 SKU，请清空其余列 (第 ${i+1} 行存在额外数据)`);
      }
    }

    const extracted = [];
    for (let i = 1; i < rows.length; i++) {
      const a = asin(rows[i][0]);
      if (a) extracted.push(a);
    }
    
    pendingFileAsins = extracted;
    $('importError').textContent = `已读取 ${extracted.length} 个有效 SKU。`;
    $('importError').style.color = 'var(--green)';
    updateImportSummary();
  } catch (err) {
    $('importError').textContent = err.message;
    $('importError').style.color = '#a53d38';
    pendingFileAsins = [];
    updateImportSummary();
    e.target.value = ''; // 清空 file input
  }
};

$('btnConfirmImport').onclick = async () => {
  const textAsins = $('skuInput').value.split(/[\s,;，；]+/).map(v => asin(v)).filter(Boolean);
  const allAsins = [...new Set([...textAsins, ...pendingFileAsins])];
  
  if (allAsins.length === 0) return $('importError').textContent = '未提供有效 ASIN。';

  const bName = $('inputBatchName').value.trim() || '批次_' + new Date().toLocaleDateString().replace(/\//g,'');
  
  const items = allAsins.map(a => ({
    itemId: 'itm_' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36),
    asin: a,
    source: {},
    collected: null,
    edits: null,
    collectStatus: 'pending',
    reviewStatus: 'pending',
    copyStatus: 'pending',
    reason: '',
    reviewReason: '',
    copyReason: '',
    audit: null,
    copy: null,
    history: []
  }));

  app.batches.push({
    id: 'b_' + Date.now(),
    name: bName,

  });

  }
};

// ========== 动作：采集与轮询 ==========
$('btnBatchCollect').onclick = async () => {
  const batch = app.batches.find(b => b.id === app.currentBatchId);
  let targets = batch.items.filter(i => i.collectStatus === 'pending' || i.collectStatus === 'error');
  
  if (app.selectedItemIds.size > 0) targets = targets.filter(i => app.selectedItemIds.has(i.itemId));
  if (targets.length === 0) return toast('没有符合条件的待采集商品。');

  await runCollection(batch, targets);
};

async function runCollection(batch, targets) {
  const asins = targets.map(t => t.asin);
  targets.forEach(t => { t.collectStatus = 'collecting'; t.reason = '排队中...'; });
  renderItems();
  
  const batchName = `wb_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;
  toast(`正在提交 ${asins.length} 个商品...`);

  try {
    const res = await fetch(`${WORKER_URL}/api/batches`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Workbench-Token': TOKEN },
      body: JSON.stringify({ asins, batch_name: batchName })
    });
    if (!res.ok) throw new Error('提交任务失败: ' + res.status);

    let isCompleted = false;
    let finalBatchId = null;
    let poll = 0;
    
    while (!isCompleted && poll < 300) {
      await new Promise(r => setTimeout(r, 2000));
      poll++;
      const stRes = await fetch(`${WORKER_URL}/api/batches/${batchName}/status`, { headers: { 'X-Workbench-Token': TOKEN } });
      if (!stRes.ok) continue;
      const data = await stRes.json();
      const done = data.done ?? data.completed ?? data.processed ?? 0;
      const total = data.total ?? asins.length;
      finalBatchId = data.id || data.batch_id || data.batchId || finalBatchId;
      
      targets.forEach(t => { t.reason = `采集进度: ${done}/${total}`; });
      renderItems();

      const stateStr = String(data.status || '').toLowerCase();
      if (done >= total || stateStr.includes('complete') || stateStr.includes('done') || data.is_done === true) isCompleted = true;
    }

    if (!isCompleted) throw new Error('轮询超时，采集未完成');

    const recordsRes = await fetch(`${WORKER_URL}/api/results?batch_id=${finalBatchId || batchName}&limit=1000`, { headers: { 'X-Workbench-Token': TOKEN } });
    if (!recordsRes.ok) throw new Error('获取数据失败');
    const recordsData = await recordsRes.json();
    let allRecords = Array.isArray(recordsData) ? recordsData : (recordsData.data || recordsData.records || recordsData.results || []);

    targets.forEach(t => {
      const match = allRecords.find(r => (r.asin || r.ASIN || r.sku || r.SKU || r.product_asin || r['ASIN (商品ID)'] || '').toUpperCase() === t.asin);
      if (match) {
        t.collected = normalizeCollectedData(match);
        t.collectStatus = 'collected';
        t.reviewStatus = 'pending';
        t.reason = '采集成功';
        t.history.push({ time: new Date().toISOString(), action: '采集成功' });
      } else {
        t.collectStatus = 'error';
        t.reason = '未返回有效数据';
      }
    });
    
    await saveData();
    toast('采集执行完毕');
    renderItems();
  } catch (e) {
    targets.forEach(t => {
      if (t.collectStatus === 'collecting') { t.collectStatus = 'error'; t.reason = e.message; }
    });
    await saveData();
    renderItems();
    toast('采集出错: ' + e.message);
  }
}

// ========== 动作：重试失败 ==========
$('btnBatchRetry').onclick = async () => {
  const batch = app.batches.find(b => b.id === app.currentBatchId);
  let targets = batch.items.filter(i => i.collectStatus === 'error');
  if (app.selectedItemIds.size > 0) targets = targets.filter(i => app.selectedItemIds.has(i.itemId));
  if (targets.length === 0) return toast('没有选中/符合条件的采集失败商品。');
  await runCollection(batch, targets);
};

// ========== 动作：勾选逻辑 ==========
function syncSelectionState() {
  const checks = document.querySelectorAll('.item-check:checked');
  app.selectedItemIds.clear();
  checks.forEach(c => app.selectedItemIds.add(c.dataset.id));
  $('selCount').textContent = app.selectedItemIds.size;
  $('selectionBar').classList.toggle('hidden', app.selectedItemIds.size === 0);
}

$('selectAll').onchange = (e) => {
  const isChecked = e.target.checked;
  document.querySelectorAll('.item-check').forEach(c => {
    if (c.closest('tr').style.display !== 'none') c.checked = isChecked;
  });
  syncSelectionState();
};

$('btnSelCancel').onclick = () => {
  document.querySelectorAll('.item-check').forEach(c => c.checked = false);
  syncSelectionState();
};

$('btnSelectAllFiltered').onclick = () => {
  document.querySelectorAll('.item-check').forEach(c => c.checked = true);
  syncSelectionState();
  toast(`已选中当前页 ${app.selectedItemIds.size} 个商品。`);
};

$('searchInput').oninput = (e) => { app.searchQuery = e.target.value; app.selectedItemIds.clear(); renderItems(); };
$('filterStatus').onchange = (e) => { app.filterStatus = e.target.value; app.selectedItemIds.clear(); renderItems(); };

// ========== 动作：批量排除与通过 ==========
$('btnBatchExclude').onclick = $('btnSelExclude').onclick = () => {
  if (app.selectedItemIds.size === 0) return toast('请先勾选商品。');
  $('excludeReason').value = '';
  $('excludeDialog').showModal();
};

$('btnConfirmExclude').onclick = async () => {
  const reason = $('excludeReason').value.trim();
  if (!reason) return toast('请填写排除原因。');
  
  const batch = app.batches.find(b => b.id === app.currentBatchId);
  let count = 0;
  batch.items.forEach(i => {
    if (app.selectedItemIds.has(i.itemId) && i.reviewStatus !== 'excluded' && i.reviewStatus !== 'passed') {
      i.reviewStatus = 'excluded';
      i.reason = reason;
      i.history.push({ time: new Date().toISOString(), action: '人工排除', detail: reason });
      count++;
    }
  });
  
  $('btnConfirmExclude').disabled = true;
  await saveData();
  $('btnConfirmExclude').disabled = false;
  
  $('excludeDialog').close();
  app.selectedItemIds.clear();
  renderItems();
  toast(`已批量排除 ${count} 个商品。`);
};

$('btnSelPass').onclick = async () => {
  const batch = app.batches.find(b => b.id === app.currentBatchId);
  let count = 0;
  batch.items.forEach(i => {
    if (app.selectedItemIds.has(i.itemId) && i.reviewStatus === 'verify') {
      i.reviewStatus = 'passed';
      i.reason = '人工批量确认通过';
      i.audit = { decision: 'passed', reason: i.reason, time: new Date().toISOString() };
      i.history.push({ time: new Date().toISOString(), action: '批量通过', detail: '人工批量确认' });
      i.copyStatus = 'completed'; 
      count++;
    }
  });
  await saveData();
  app.selectedItemIds.clear();
  renderItems();
  toast(`成功批量通过 ${count} 个商品。`);
};

// ========== 动作：导出 ==========
function exportBatch(batchId, type) {
  const batch = app.batches.find(b => b.id === batchId);
  if (!batch) return;
  
  if (type === 'passed') {
    const items = batch.items.filter(i => i.reviewStatus === 'passed' && i.copyStatus === 'completed');
    if (items.length === 0) return toast('该批次没有可导出的通过商品。');
    
    // 动态生成表头
    const headers = ['SKU'];
    if (exportPrefs.link) headers.push('亚马逊链接');
    if (exportPrefs.title) headers.push('清理后的标题');
    if (exportPrefs.bullets) headers.push('清理后的五点描述');
    if (exportPrefs.desc) headers.push('清理后的长描述');
    
    const rows = [headers];
    items.forEach(i => {
      const row = [i.asin];
      if (exportPrefs.link) row.push('https://www.amazon.com/dp/' + i.asin);
      if (exportPrefs.title) row.push(i.copy?.title || i.collected?.title || '');
      if (exportPrefs.bullets) row.push(i.copy?.bullets || i.collected?.bullets || '');
      if (exportPrefs.desc) row.push(i.copy?.description || i.collected?.description || '');
      rows.push(row);
    });
    downloadCSV(rows, `批次通过商品_${batch.name}.csv`);
  } else {
    const items = batch.items.filter(i => i.collectStatus === 'error' || i.reviewStatus === 'error' || i.copyStatus === 'error');
    if (items.length === 0) return toast('该批次没有失败记录。');
    
    // 失败清单固定字段，不受设置影响
    const rows = [['SKU', '亚马逊链接', '失败环节', '失败原因']];
    items.forEach(i => {
      let step = i.collectStatus === 'error' ? '采集' : (i.reviewStatus === 'error' ? '审核' : '文案');
      rows.push([i.asin, 'https://www.amazon.com/dp/' + i.asin, step, i.reason]);
    });
    downloadCSV(rows, `批次失败清单_${batch.name}.csv`);
  }
}

function downloadCSV(rows, filename) {
  const csvContent = '\ufeff' + rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
  const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}
window.exportBatch = exportBatch;

// ========== 动作：商品详情 ==========
function openDetail(itemId) {
  app.detailItemId = itemId;
  const batch = app.batches.find(b => b.id === app.currentBatchId);
  const item = batch.items.find(i => i.itemId === itemId);
  if (!item) return;

  $('dtTitle').textContent = item.asin + ' · 商品详情';
  
  let bText = '待处理', bCls = 'b-gray';
  if (item.reviewStatus === 'passed') { bText = '已通过'; bCls = 'b-pass'; }
  if (item.reviewStatus === 'excluded') { bText = '已排除'; bCls = 'b-err'; }
  if (item.reviewStatus === 'verify') { bText = '待核验'; bCls = 'b-warn'; }
  $('dtStatus').textContent = bText;
  $('dtStatus').className = `badge ${bCls}`;

  const title = item.collected?.title || item.source?.title || '未提供';
  const bullets = item.collected?.bullets || item.source?.bullets || '未提供';
  const desc = item.collected?.description || item.source?.description || '未提供';
  
  let html = `
    <div class="detail-grid">
      <div>
        <div class="section-box">
          <h4>商品资料</h4>
          <div class="field"><div class="label">标题</div><div class="text">${esc(title)}</div></div>
          <div class="field"><div class="label">五点描述</div><div class="text">${esc(bullets)}</div></div>
          <div class="field"><div class="label">长描述</div><div class="text">${esc(desc)}</div></div>
        </div>
      </div>
      <div>
  `;

  if (item.reviewStatus === 'verify') {
    html += `
      <div class="section-box" style="background:#fffbf2;border-color:#f2d8a6">
        <h4>待核验处理</h4>
        <div class="field"><div class="label">系统提示原因</div><div style="color:#966314;font-weight:500">${esc(item.reason || '需人工介入确认')}</div></div>
        <div class="form-group" style="margin-top:15px">
          <label>核验结论</label>
          <select id="dtDecision">
            <option value="passed">确认通过（进入文案清理）</option>
            <option value="excluded">排除商品</option>
          </select>
        </div>
        <div class="form-group">
          <label>人工核验依据（必填）</label>
          <textarea id="dtReviewReason" rows="3"></textarea>
        </div>
      </div>
    `;
  } else if (item.reviewStatus === 'excluded') {
    html += `<div class="section-box" style="background:#fceceb;border-color:#f2cac7"><h4>排除原因</h4><div class="text" style="background:transparent;border:none;padding:0">${esc(item.reason || '人工排除')}</div></div>`;
  } else if (item.reviewStatus === 'passed') {
    html += `<div class="section-box" style="background:#e7f4ec;border-color:#c3e6d3"><h4>审核结论</h4><div class="field"><div class="label">文案状态</div><div>${item.copyStatus === 'completed' ? '文案已就绪，可导出' : '等待 AI 清理接入'}</div></div>`;
    if (item.copyStatus === 'verify') {
      html += `
        <div style="margin-top:15px;border-top:1px solid #c3e6d3;padding-top:15px">
          <div class="form-group"><label>清理后标题</label><input type="text" id="dtCopyTitle" value="${esc(item.copy?.title || title)}"></div>
          <div class="form-group"><label>清理后五点</label><textarea id="dtCopyBullets" rows="3">${esc(item.copy?.bullets || bullets)}</textarea></div>
          <div class="form-group"><label>清理后长描述</label><textarea id="dtCopyDesc" rows="3">${esc(item.copy?.description || desc)}</textarea></div>
        </div>
      `;
    }
    html += `</div>`;
  } else if (item.reviewStatus === 'pending') {
    html += `<div class="section-box"><h4>当前进度</h4><p class="muted">等待接入 AI 审核接口，或请人工介入核验。</p></div>`;
  }

  html += `</div></div>`;
  $('dtBody').innerHTML = html;

  let footerHtml = `<button data-close>关闭</button>`;
  if (item.reviewStatus === 'verify') footerHtml = `<button data-close>取消</button><button class="primary" onclick="saveDetailVerify()">保存结论</button>`;
  else if (item.copyStatus === 'verify') footerHtml = `<button data-close>取消</button><button class="primary" onclick="saveDetailCopy()">确认清理文案</button>`;
  
  $('dtFooter').innerHTML = footerHtml;
  $('detailDialog').showModal();
}

async function saveDetailVerify() {
  const batch = app.batches.find(b => b.id === app.currentBatchId);
  const item = batch.items.find(i => i.itemId === app.detailItemId);
  const decision = $('dtDecision').value;
  const reason = $('dtReviewReason').value.trim();
  if (!reason) return toast('请填写人工核验依据。');
  
  item.reviewStatus = decision;
  item.reason = reason;
  item.audit = { decision, reason, time: new Date().toISOString() };
  item.history.push({ time: new Date().toISOString(), action: '人工' + (decision === 'passed' ? '通过' : '排除'), detail: reason });
  if (decision === 'passed') item.copyStatus = 'completed'; 
  
  const btn = $('dtFooter').querySelector('.primary');
  btn.disabled = true; btn.textContent = '保存中...';
  const ok = await saveData();
  btn.disabled = false; btn.textContent = '保存结论';
  if (ok) {
    $('detailDialog').close();
    renderItems();
    toast('核验结论已保存。');
  }
}

async function saveDetailCopy() {
  const batch = app.batches.find(b => b.id === app.currentBatchId);
  const item = batch.items.find(i => i.itemId === app.detailItemId);
  item.copy = {
    title: $('dtCopyTitle').value.trim(),
    bullets: $('dtCopyBullets').value.trim(),
    description: $('dtCopyDesc').value.trim(),
    confirmed: true, time: new Date().toISOString()
  };
  item.copyStatus = 'completed';
  item.history.push({ time: new Date().toISOString(), action: '确认清理文案' });
  
  const btn = $('dtFooter').querySelector('.primary');
  btn.disabled = true; btn.textContent = '保存中...';
  const ok = await saveData();
  btn.disabled = false; btn.textContent = '确认清理文案';
  if (ok) {
    $('detailDialog').close();
    renderItems();
    toast('清理文案已确认。');
  }
}
